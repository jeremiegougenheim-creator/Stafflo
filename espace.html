<style>
:root{color-scheme:light;
  --paper:#F4EFE3;--cream:#FAF6EE;--card:#FFFDF8;--gd:#0F2318;--gm:#1d4d3a;--gold:#C9963A;--gold-ink:#8e6414;
  --ink:#1A1208;--muted:#706B5D;--line:rgba(26,18,8,.10);--line2:rgba(26,18,8,.06);
  --go-bg:#E3F0E8;--go:#1F6B47;--wait-bg:#FDF0D6;--wait:#8A5D0F;--house-bg:#E6EEF6;--house:#2C5875;--alert-bg:#FAE8E2;--alert:#9B3A25;
  --r-sm:8px;--r-md:11px;--r-lg:14px;--r-xl:18px;
  --shadow:0 1px 2px rgba(26,18,8,.04),0 8px 24px -16px rgba(26,18,8,.18);
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--gm)}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--cream)}
@media (min-width:560px){#app{min-height:calc(100vh - 32px);margin:16px auto;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(15,35,24,.18)}}
header.top{background:linear-gradient(158deg,#182821,#13201A 55%,#0E1B15);color:#F4EFE3;padding:calc(12px + env(safe-area-inset-top)) 18px 14px;display:flex;flex-direction:column;gap:6px}
header.top .k{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#E5C77A}
header.top h1{margin:0;font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1;letter-spacing:.01em}
header.top .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(244,239,227,.12);color:#F4EFE3;white-space:nowrap}
.chip.off{background:var(--alert-bg);color:var(--alert)}
.langsw{margin-left:auto;display:flex;border:1px solid rgba(229,199,122,.5);border-radius:999px;overflow:hidden}
.langsw button{min-height:32px;min-width:44px;border:0;background:transparent;color:#F4EFE3;font-size:12px;font-weight:600;cursor:pointer}
.langsw button[aria-pressed="true"]{background:#E5C77A;color:var(--gd)}
main{flex:1 1 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.card .h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);background:linear-gradient(90deg,rgba(29,77,58,.05),transparent 60%)}
.card .h .i{width:30px;height:30px;border-radius:var(--r-sm);background:var(--wait-bg);color:var(--gold-ink);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.card .h h2{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--gm);flex:1}
.card .b{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pill{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.t-go{background:var(--go-bg);color:var(--go)}.t-wait{background:var(--wait-bg);color:var(--wait)}
.t-house{background:var(--house-bg);color:var(--house)}.t-alert{background:var(--alert-bg);color:var(--alert)}
.gold{background:var(--wait-bg);color:var(--gold-ink)}
.sub{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:2px}
.tile .l{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.tile .v{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.1}
.stay{border:1px solid var(--line);border-left:3px solid var(--house);border-radius:var(--r-md);background:#fff;padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.stay.alert{border-left-color:var(--alert)}.stay.wait{border-left-color:var(--gold)}.stay.go{border-left-color:var(--go)}
.stay .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.stay .nm{font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.15}
.stay .dt{font-size:13px;color:var(--muted)}
.stay .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.check{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;border-top:1px solid var(--line2);padding-top:10px}
.act{min-height:44px;border:1.5px solid var(--line);border-radius:var(--r-md);background:#fff;color:var(--gm);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;padding:0 8px;text-decoration:none;text-align:center}
.act:hover{border-color:var(--gold);background:#fffaf0}
.act:active{transform:scale(.97)}
.act i{font-size:18px}
.btn{min-height:46px;padding:0 16px;border:0;border-radius:var(--r-md);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.gold{background:var(--gold);color:var(--gd)}
.btn.green{background:var(--gd);color:#F4EFE3}
.btn.ghost{background:transparent;color:var(--gm);border:1.5px solid var(--line)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{border:1px solid var(--line);border-radius:var(--r-md);background:var(--cream);padding:10px;display:flex;flex-direction:column;gap:8px}
.panel .ttl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gm)}
textarea.t,input.t{width:100%;border:1.5px solid var(--line);border-radius:var(--r-md);background:#fff;padding:10px 12px;font-size:14px;line-height:1.45}
textarea.t{min-height:150px;resize:vertical}
input.t{min-height:44px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 > *{flex:1 1 auto}
.line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line2)}
.line:last-child{border-bottom:0}
.line b{white-space:nowrap;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;background:var(--gd);color:#F4EFE3;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;max-width:92vw;box-shadow:var(--shadow)}
.toast.err{background:var(--alert)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
@media (min-width:560px){nav.tabs{position:sticky}}
nav.tabs button{min-height:54px;border:0;background:transparent;border-radius:12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav.tabs button i{font-size:22px}
nav.tabs button[aria-current="page"]{color:var(--gm)}
nav.tabs button[aria-current="page"] i{color:var(--gold)}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--alert);color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center}
/* ARIA : seule surface verte (règle v19) */
.aria{background:radial-gradient(120% 140% at 8% 0%,#1e4632 0%,#0F2318 60%);color:#fff;border:1px solid rgba(201,150,58,.34);border-radius:var(--r-xl);padding:14px;display:flex;flex-direction:column;gap:10px}
.aria .msg{border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.aria .msg.u{background:rgba(244,239,227,.12);align-self:flex-end;max-width:88%}
.aria .msg.a{background:#FFFDF8;color:var(--ink);max-width:100%}
.aria .msg.a .cp{margin-top:8px}
.aria .chips{display:flex;flex-wrap:wrap;gap:6px}
.aria .chips button{min-height:38px;border-radius:999px;border:1px solid rgba(229,199,122,.55);background:transparent;color:#F4EFE3;font-size:13px;padding:0 12px;cursor:pointer}
.aria textarea{width:100%;min-height:84px;border-radius:12px;border:2px solid #1d4d3a;background:#fff;color:var(--ink);padding:10px 12px;font-size:15px;resize:vertical}
.fact-t{width:100%;border-collapse:collapse;font-size:14px}
.fact-t th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:0 0 6px}
.fact-t th:first-child{text-align:left}
.fact-t td{padding:7px 0;border-top:1px solid var(--line2);vertical-align:top}
.fact-t td.n{text-align:right;white-space:nowrap;font-weight:600;padding-left:14px}
ul.f{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
details.dig summary{cursor:pointer;font-weight:600;color:var(--gm);min-height:44px;display:flex;align-items:center}
details.dig pre{white-space:pre-wrap;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:10px;max-height:340px;overflow:auto;margin:0}
.empty{font-size:14px;color:var(--muted);padding:6px 0}
.login{padding:24px 18px;display:flex;flex-direction:column;gap:12px}
.login label{font-size:12px;font-weight:600;color:var(--muted)}
.err{color:var(--alert);font-size:13px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="k" id="kicker">Villa Dar J · Marrakech</span>
