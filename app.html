<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><rect width='26' height='26' rx='6' fill='%23C9963A'/><text x='13' y='19' font-family='Georgia' font-size='16' font-weight='700' fill='%230F2318' text-anchor='middle'>S</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#0F2318">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Stafflo">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Villa management app for luxury staffed villas">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230F2318'/><rect x='15' y='15' width='150' height='150' rx='30' fill='%23C9963A' opacity='.15'/><text x='90' y='125' font-family='Georgia,serif' font-size='100' font-weight='700' fill='%23C9963A' text-anchor='middle'>S</text></svg>">
    <title>Stafflo — Villa Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* CSS de base reprenant ta charte Stafflo */
        :root {
            --bg-color: #FAFAFA;
            --text-main: #0F2318;
            --accent: #C9963A;
            --font-heading: 'Fraunces', serif;
            --font-body: 'DM Sans', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        header {
            background-color: var(--text-main);
            color: #FFF;
            padding: 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 600;
            color: var(--accent);
            margin: 0;
        }

        /* ── TABS ── */
        nav {
            display: flex;
            border-bottom: 1px solid #E0E0E0;
            background: #FFF;
            padding: 0 16px;
        }

        .tab {
            padding: 16px;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent);
        }

        main {
            padding: 16px;
        }
        
        .content-section {
            display: none;
        }
        
        .content-section.active {
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">Stafflo</h1>
        <div class="header-right">
            <button id="logoutBtn" style="background: none; border: 1px solid #C9963A; color: #C9963A; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Déconnexion</button>
        </div>
    </header>

    <div id="villaSwitcher" style="margin: 16px 16px;"></div>

    <nav>
        <div class="tab active" onclick="switchTab('today')">Today</div>
        <div class="tab" onclick="switchTab('crm')">CRM</div>
        <div class="tab" onclick="switchTab('chat')">Chat</div>
    </nav>

    <main>
        <div id="today" class="content-section active">
            <h2 style="font-family: var(--font-heading);">Opérations du jour</h2>
            <p>Chargement des données de la villa...</p>
        </div>
        <div id="crm" class="content-section">
            <h2 style="font-family: var(--font-heading);">Clients</h2>
            <p>Liste des clients à venir.</p>
        </div>
        <div id="chat" class="content-section">
            <h2 style="font-family: var(--font-heading);">Messages</h2>
            <p>Boîte de réception unifiée.</p>
        </div>
    </main>

    <script>
        // 1. INITIALISATION SUPABASE (À REMPLACER PAR TES VRAIES CLÉS)
        const supabaseUrl = 'TON_SUPABASE_URL';
        const supabaseAnonKey = 'TON_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        // 2. ÉTAT DE L'APPLICATION
        let APP_STATE = {
            user: null,
            villas: [],
            currentVillaId: null,
            currentVilla: null
        };

        // 3. FONCTIONS PRINCIPALES
        async function requireSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                // Redirection si non connecté
                window.location.href = 'login.html'; 
                return null;
            }
            APP_STATE.user = session.user;
            return session.user;
        }

        async function loadVillas() {
            const user = APP_STATE.user;
            const { data, error } = await supabase
                .from('villas')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: true });
                
            if (error) {
                console.error("Erreur de chargement des villas:", error);
                return;
            }
            
            APP_STATE.villas = data || [];
            APP_STATE.currentVilla = APP_STATE.villas[0] || null;
            APP_STATE.currentVillaId = APP_STATE.currentVilla ? APP_STATE.currentVilla.id : null;
        }

        function renderVillaSwitcher() {
            const el = document.getElementById('villaSwitcher');
            if (!el) return;
            
            if (!APP_STATE.villas || APP_STATE.villas.length === 0) {
                el.innerHTML = '<div style="padding:12px;background:#FFF;border:1px solid #ddd;border-radius:12px;">Aucune villa trouvée. Veuillez en configurer une.</div>';
                return;
            }
            
            if (APP_STATE.villas.length === 1) {
                el.innerHTML = `
                    <div style="padding:12px;background:#FFF;border:1px solid #ddd;border-radius:12px;">
                        Villa active : <strong style="color:var(--text-main); font-family:var(--font-heading);">${APP_STATE.villas[0].name}</strong>
                    </div>
                `;
                return;
            }
            
            el.innerHTML = `
                <label style="display:block;margin-bottom:6px;font-weight:500;font-size:14px;color:#666;">Propriété active</label>
                <select id="villaSelect" style="width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;font-family:var(--font-body);font-size:16px;background:#FFF;color:var(--text-main);">
                    ${APP_STATE.villas.map(v => `
                        <option value="${v.id}" ${v.id === APP_STATE.currentVillaId ? 'selected' : ''}>
                            ${v.name}
                        </option>
                    `).join('')}
                </select>
            `;
            
            document.getElementById('villaSelect').addEventListener('change', (e) => {
                const villaId = e.target.value;
                const villa = APP_STATE.villas.find(v => v.id === villaId);
                APP_STATE.currentVillaId = villaId;
                APP_STATE.currentVilla = villa;
                refreshCurrentVillaData();
            });
        }

        async function refreshCurrentVillaData() {
            console.log('Reload data for villa:', APP_STATE.currentVillaId);
            // C'est ici que tu mettras tes requêtes .eq('villa_id', APP_STATE.currentVillaId) 
            // pour filtrer les tâches, les clients et les messages.
            
            const todayTab = document.getElementById('today');
            if(APP_STATE.currentVilla) {
                todayTab.innerHTML = `
                    <h2 style="font-family: var(--font-heading);">Opérations du jour</h2>
                    <p>Affichage des données filtrées pour : <strong>${APP_STATE.currentVilla.name}</strong></p>
                `;
            }
        }

        // Gestionnaire de navigation (Tabs)
        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Déconnexion
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        // 4. DÉMARRAGE DE L'APPLICATION
        (async function initApp() {
            const user = await requireSession();
            if (!user) return; // Stoppe l'exécution si non connecté (redirection gérée)
            
            await loadVillas();
            renderVillaSwitcher();
            
            if (!APP_STATE.currentVilla) {
                console.log('Aucune villa trouvée');
                return;
            }
            
            await refreshCurrentVillaData();
        })();
    </script>
</body>
</html>
