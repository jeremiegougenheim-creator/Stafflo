<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livret d'accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2318;
  --ink-soft:#2C4438;
  --cream:#FAF6EE;
  --paper:#FFFCF5;
  --gold:#C9963A;
  --terracotta:#B5533A;
  --rule:rgba(15,35,24,.14);
  --muted:#6B6760;
  --serif:'Noto Serif Display',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#E8E2D6;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ───────── Barre d'édition (écran seulement) ───────── */
/* Lien personnel ouvert par le client (sans session propriétaire) : la barre d'édition
   (nom, dates, tarif négocié, PDF) est l'outil du propriétaire — jamais montrée au client. */
html.guest .bar{display:none}
.bar{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--cream);
     padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
     box-shadow:0 2px 20px rgba(15,35,24,.3)}
.bar h1{font-family:var(--serif);font-size:17px;font-weight:500;margin:0 18px 0 0;
        letter-spacing:.4px;align-self:center;white-space:nowrap}
.bar h1 span{color:var(--gold)}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(250,246,238,.55);font-weight:500}
.f input,.f select{font-family:var(--sans);font-size:13.5px;padding:7px 10px;border-radius:6px;
      border:1px solid rgba(250,246,238,.22);background:rgba(250,246,238,.08);color:var(--cream);min-width:130px}
.f input:focus,.f select:focus{outline:2px solid var(--gold);outline-offset:1px}
.f select option{background:var(--ink);color:var(--cream)}
.btn{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:8px 18px;border-radius:6px;
     border:1px solid var(--gold);background:var(--gold);color:var(--ink);cursor:pointer}
.btn:hover{background:#d9a749}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover{background:rgba(201,150,58,.14)}
.bar .spacer{flex:1}
.hint{width:100%;font-size:11.5px;color:rgba(250,246,238,.5);margin-top:2px}
/* Personnes non connue depuis la réservation : mise en évidence écran
   uniquement (la barre est déjà display:none à l'impression, cf. @media print). */
.f.is-missing input{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,150,58,.35)}
.f.is-missing label::after{content:" — à compléter";color:var(--gold);text-transform:none;letter-spacing:0}

/* ───────── Le livret ───────── */
.sheet{max-width:820px;margin:26px auto;background:var(--paper);padding:52px 60px 46px;
       box-shadow:0 8px 40px rgba(15,35,24,.16)}
.page+.page{margin-top:28px;padding-top:28px;border-top:1px dashed var(--rule)}

.cover{text-align:center;padding:18px 0 30px}
.eyebrow{font-family:var(--sans);font-size:10.5px;letter-spacing:4.5px;text-transform:uppercase;color:var(--muted)}
.cover .villa{font-family:var(--serif);font-size:50px;font-weight:400;margin:12px 0 8px;line-height:1.05}
.diamonds{color:var(--gold);letter-spacing:9px;font-size:12px;margin:6px 0 14px}
.cover .stay{font-family:var(--sans);font-size:12.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--ink-soft)}

.hello{font-family:var(--serif);font-size:22px;margin:26px 0 8px}
.lede{font-size:13.5px;line-height:1.7;color:var(--ink-soft);max-width:60ch}

.infobox{background:var(--cream);border-left:3px solid var(--gold);padding:16px 20px;margin:24px 0 8px}
/* « Votre arrivée » : le client répond depuis son lien personnel (écran seulement, jamais imprimé) */
.arrive{background:#fff;border:1.5px solid var(--gold);border-radius:6px;padding:16px 18px;margin:22px 0 6px}
.arrive h3{margin:0 0 4px;font-family:var(--serif);font-size:20px;font-weight:500}
.arrive .why{font-size:12.5px;line-height:1.6;color:var(--muted);margin:0 0 12px}
.arrive label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.arrive input,.arrive textarea{width:100%;box-sizing:border-box;border:1px solid var(--rule);border-radius:4px;padding:9px 10px;font:inherit;font-size:14px;color:var(--ink);background:var(--paper)}
.arrive textarea{min-height:72px;resize:vertical}
.arrive .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.arrive .send{margin-top:14px;min-height:44px;padding:0 18px;border:0;border-radius:4px;background:var(--ink);color:var(--cream);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.arrive .send:disabled{opacity:.5;cursor:default}
.arrive .st{margin:10px 0 0;font-size:13px;font-weight:600;color:#1F6B47}.arrive .st.err{color:var(--terracotta)}
.arrive .en{display:block;font-style:italic;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
/* Commande avant l'arrivée (15/10/2026) */
.arrive .ord{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.arrive .ord-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule)}
.arrive .ord-n{display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0}.arrive .ord-n span{font-size:12.5px;color:var(--muted);line-height:1.45}
.arrive .step{display:flex;align-items:center;gap:6px;flex-shrink:0}
.arrive .step button{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);font:inherit;font-size:18px;line-height:1;cursor:pointer;color:var(--ink)}
.arrive .step output{min-width:24px;text-align:center;font-weight:600;font-size:15px}
.arrive .ord-tot{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:15px}.arrive .ord-tot b{white-space:nowrap}
.arrive select{width:100%;box-sizing:border-box;border:1px solid var(--rule);border-radius:4px;padding:9px 10px;font:inherit;font-size:14px;color:var(--ink);background:var(--paper)}
/* Fiches voyageurs (déclaration aux autorités) — écran seulement, jamais imprimé */
.arrive .reg-p{border-top:1px solid var(--rule);padding:8px 0}
.arrive .reg-p summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;min-height:32px}
.arrive .add{margin-top:10px;min-height:40px;padding:0 14px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.infobox div{font-size:12.5px;line-height:1.85}
.infobox .k{font-weight:700}

h2{font-family:var(--serif);font-size:22px;font-weight:500;margin:28px 0 6px;
   padding-bottom:7px;border-bottom:1px solid var(--rule)}
h2::before{content:"◆";color:var(--terracotta);font-size:13px;margin-right:9px;vertical-align:2px}
h3{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:2.6px;
   text-transform:uppercase;color:var(--terracotta);margin:12px 0 5px}

ul{margin:9px 0;padding-left:18px}
li{font-size:13px;line-height:1.55;margin-bottom:5px}
p{font-size:13px;line-height:1.6;margin:8px 0}
.en{font-style:italic;color:var(--muted);display:block;font-size:12.2px;line-height:1.5;margin-top:0}

/* Chambres */
.room{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--rule)}
.room:last-child{border-bottom:none}
.rn{font-family:var(--serif);font-size:27px;color:var(--gold);line-height:1;width:34px;flex-shrink:0}
.rb{flex:1;min-width:0}
.rt{font-family:var(--serif);font-size:17px;margin-bottom:5px}
.rd{font-size:12.3px;line-height:1.65;color:var(--ink-soft)}
.rd b{font-family:var(--sans);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tag{display:inline-block;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;
     background:rgba(201,150,58,.16);color:#8a6520;padding:3px 8px;border-radius:3px;margin-bottom:6px}

/* Tableau repas */
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.3px}
th{font-family:var(--sans);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;
   text-align:left;padding:9px 8px;border-bottom:1.5px solid var(--ink);color:var(--ink)}
td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
td:first-child{font-weight:500}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
/* Le contact de l'hote est un recours, pas une alternative : plus petit,
   en gris, detache par un filet. On le trouve si on le cherche, on ne
   tombe pas dessus en lisant le bloc contacts. */
.host-fallback{font-size:11px;color:var(--muted);margin-top:8px;padding-top:7px;
               border-top:1px solid var(--rule);line-height:1.5}
.callout{background:var(--cream);border-left:3px solid var(--gold);padding:10px 14px;margin:10px 0 4px;
         font-size:12px;line-height:1.55;color:var(--ink-soft)}

/* QR WhatsApp — fond blanc garanti derriere le SVG (le fond de page est
   creme/paper, pas blanc pur), break-inside:avoid pour ne jamais couper un
   QR entre deux pages a l'impression. */
.qr-block{display:flex;gap:30mm;margin:14px 0 4px;break-inside:avoid}
.qr-item{text-align:center}
.qr-svg{width:110px;height:110px;background:#fff;display:block}
.qr-cap{font-size:10.5px;color:var(--ink-soft);margin-top:6px}
.qr-note{font-size:11px;color:var(--muted);line-height:1.6;margin:6px 0 4px}

.cols{column-count:2;column-gap:32px}
.cols li{break-inside:avoid}
.links li{break-inside:avoid;margin-bottom:10px}
a{color:var(--terracotta);text-decoration:none;border-bottom:1px solid rgba(181,83,58,.35)}
.sig{font-family:var(--serif);font-size:19px;margin-top:34px;text-align:right}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--rule);
      font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center}

/* ───────── Impression ───────── */
@page{size:A4;margin:16mm}
@media print{
  body{background:#fff}
  .bar,.hint,.arrive{display:none !important}
  .sheet{max-width:none;margin:0;padding:0;box-shadow:none;background:#fff}
  /* Aucune regle ne redefinit strong ailleurs : on s'appuie donc sur
     font-weight:bolder par defaut du navigateur. A l'impression, certains
     moteurs (Safari notamment) peuvent retomber sur la graisse normale du
     web font sans le signaler par un changement de mise en page — d'ou le
     poids explicite, force, au lieu de compter sur le comportement implicite. */
  strong{font-weight:700 !important}
  /* Le document coule. page-break-after:always forcait une feuille par
     section : les Regles de la maison (5 puces) consommaient une page
     entiere, et la derniere n'avait que trois lignes. C'etait la cause du
     blanc, pas les interlignes. Les sections sont marquees par leurs titres
     et leurs filets, pas par du papier. */
  .page{page-break-after:auto}
  .page+.page{margin-top:14px;padding-top:0;border-top:none}
  /* On empeche seulement les coupures laides : un titre seul en bas de page,
     une ligne orpheline, un bloc chambre ou une ligne de tableau scindee. */
  h2,h3{page-break-after:avoid;break-after:avoid}
  /* table ici en plus de tr : sans ca, tr:avoid empeche une ligne d'etre
     coupee EN DEUX mais laisse le tableau se scinder ENTRE deux lignes, avec
     repetition du thead sur la page suivante — c'est ce qui isolait la ligne
     petit-dejeuner du reste du tableau repas en bilingue. */
  .room,table,tr,li{page-break-inside:avoid;break-inside:avoid}
  p,li{orphans:2;widows:2}
  a{color:var(--terracotta)}

  /* ── Densite d'impression ──────────────────────────────────────────────
     Les espacements ci-dessus sont regles pour l'ecran, ou il faut respirer :
     34px au-dessus de chaque h2, 22px au-dessus de chaque h3, 7px sous chaque
     puce. Applique tel quel au papier, cela gonfle le document sans rien
     apporter. On resserre ici, et ici seulement — la lecture a l'ecran reste
     inchangee. */
  h2{margin:22px 0 5px;font-size:20px;padding-bottom:4px}
  h3{margin:9px 0 4px}
  p{margin:7px 0;line-height:1.48}
  ul{margin:8px 0}
  li{margin-bottom:4px;line-height:1.42}
  .en{line-height:1.4;font-size:11.8px}
  .lede{line-height:1.5}
  .cover{padding:10px 0 18px}
  .cover .villa{font-size:42px;margin:8px 0 6px}
  .hello{margin:18px 0 6px}
  .infobox{margin:16px 0 6px;padding:12px 16px}
  .infobox div{line-height:1.6}
  .qr-svg{width:28mm;height:28mm}
  .qr-block{margin:10px 0 2px;justify-content:center}
  .qr-note{text-align:center}
  .room{padding:9px 0}
  table{margin:10px 0}
  th,td{padding:6px 8px}
  .links li{margin-bottom:5px}
  .sig{margin-top:22px}
  .foot{margin-top:18px;padding-top:9px}
}
@media (max-width:700px){
  .sheet{padding:28px 22px;margin:14px 8px}
  .cover .villa{font-size:36px}
  .cols{column-count:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div class="bar">
  <h1>Livret <span id="barVilla"></span></h1>
  <div class="f"><label for="g">Client</label><input id="g" value="Fuji" autocomplete="off"></div>
  <div class="f"><label for="d">Dates</label><input id="d" value="3–6 JUL 26" autocomplete="off"></div>
  <div class="f" id="pWrap"><label for="p">Personnes</label><input id="p" type="number" min="1" max="10" placeholder="?" style="min-width:80px"></div>
  <div class="f"><label for="tr">Tarif négocié</label><input id="tr" placeholder="brunch/déj/dîner" autocomplete="off" style="min-width:130px"></div>
  <div class="f"><label for="grp">Groupe</label>
    <select id="grp">
      <option value="">—</option>
      <option value="famille">Famille</option>
      <option value="amis">Amis</option>
    </select>
  </div>
  <div class="f"><label for="l">Langue</label>
    <select id="l">
      <option value="bi">Bilingue FR / EN</option>
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="print">Enregistrer en PDF</button>
  <div class="hint">Le bouton ouvre la fenêtre d'impression — choisissez « Enregistrer au format PDF » comme destination. La barre d'édition n'apparaît pas dans le document.</div>
</div>

<div class="sheet" id="sheet"></div>

<script src="house-facts.js"></script>
<script>
/* ═══ Fiche maison : en base (villa_settings.house_facts), plus dans le site public ═══
   Le livret la demande, dans cet ordre :
     1. ?t=<jeton> — lien personnel du séjour → fonction livret-view ;
     2. le propriétaire connecté sur ce navigateur (session de l'app) → sa ligne villa_settings ;
     3. ancien lien ?guest=&dates= (livret envoyé avant le 14/10/2026) → livret-view,
        nom et dates exacts, séjour pas terminé.
   Puis le script du livret (#livret-main, inchangé) s'exécute avec window.VILLA_FACTS.
   Sinon : un message clair — jamais une fiche vide ou celle d'une autre villa. */
(function () {
  var SB_URL = 'https://rcjhgilpmojohmrqzokx.supabase.co';
  var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjamhnaWxwbW9qb2htcnF6b2t4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NDg4NzYsImV4cCI6MjA5MDIyNDg3Nn0.J7As0S5aw2ViIyKZXPNH6Kga5IUhn5XCz1khKcul8uQ';
  var q = new URLSearchParams(location.search);
  var tok = q.get('t') || '', guest = q.get('guest') || '', dates = q.get('dates') || '';
  function fail(r) { var e = new Error('http_' + r.status); e.status = r.status; throw e; }
  function view(qs) {
    return fetch(SB_URL + '/functions/v1/livret-view?' + qs, { cache: 'no-store' }).then(function (r) {
      return r.ok ? r.json().then(function (b) { if (b && b.answers) window.LIVRET_CTX.answers = b.answers; if (b && b.orders) window.LIVRET_CTX.orders = b.orders; if (b && b.reg) window.LIVRET_CTX.reg = b.reg; return b && b.facts; }) : fail(r);
    });
  }
  /* Contexte du séjour pour le bloc « Votre arrivée » : le jeton (s'il y en a un) et ce que le client a déjà répondu. */
  window.LIVRET_CTX = { token: tok, answers: null, url: SB_URL + '/functions/v1/livret-view' };
  function ownerStep() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem('stafflo_session') || 'null'); } catch (e) {}
    if (!s || !s.access_token || !s.user || !s.user.id) return null;
    if (s.expires_at && s.expires_at * 1000 < Date.now() + 30000) return null; // jamais de rafraîchissement ici : la session appartient à l'app
    return function () {
      return fetch(SB_URL + '/rest/v1/villa_settings?select=house_facts&owner_id=eq.' + encodeURIComponent(s.user.id) + '&limit=1', {
        headers: { apikey: SB_ANON, Authorization: 'Bearer ' + s.access_token }, cache: 'no-store'
      }).then(function (r) { return r.ok ? r.json() : fail(r); }).then(function (rows) { return rows && rows[0] && rows[0].house_facts; });
    };
  }
  var steps = [];
  if (tok) steps.push(function () { return view('t=' + encodeURIComponent(tok)); });
  var own = ownerStep(); if (own) steps.push(own);
  // Client (lien personnel, pas de session propriétaire ici, pas de ?edit=1) : page de lecture seulement.
  if (tok && !own && q.get('edit') !== '1') document.documentElement.classList.add('guest');
  if (!tok && guest && dates) steps.push(function () { return view('guest=' + encodeURIComponent(guest) + '&dates=' + encodeURIComponent(dates)); });

  function start(F) {
    window.VILLA_FACTS = F;
    // Nom de la villa du livret (toute villa, 15/10/2026) : onglet et barre d'édition, avant le script du livret.
    var vn = String((F.VILLA && F.VILLA.name) || '').trim();
    if (vn) { document.title = 'Livret d\'accueil — ' + vn; var bv = document.getElementById('barVilla'); if (bv) bv.textContent = vn; }
    var main = document.getElementById('livret-main'), s = document.createElement('script');
    s.text = main.textContent;
    document.body.appendChild(s);
  }
  var MSG = {
    gone: ['Ce livret n’est plus disponible. Demandez le lien à jour à votre hôte.', 'This welcome booklet is no longer available. Please ask your host for an up-to-date link.'],
    nolink: ['Ouvrez ce livret avec le lien reçu de votre hôte.', 'Please open this booklet with the link your host sent you.'],
    net: ['Le livret n’a pas pu se charger. Vérifiez votre connexion, puis rechargez la page.', 'The booklet could not load. Check your connection, then reload the page.']
  };
  function message(kind) {
    var l = q.get('lang'), pair = MSG[kind], box = document.createElement('div');
    box.setAttribute('role', 'status');
    box.style.cssText = 'max-width:560px;margin:72px auto;padding:36px 30px;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:20px;line-height:1.5;text-align:center;border-radius:4px';
    (l === 'en' ? [pair[1]] : l === 'fr' ? [pair[0]] : pair).forEach(function (t, i) {
      var p = document.createElement('p'); p.textContent = t; p.style.margin = i ? '14px 0 0' : '0';
      if (i) { p.style.fontStyle = 'italic'; p.style.color = 'var(--muted)'; }
      box.appendChild(p);
    });
    var sheet = document.getElementById('sheet'); sheet.textContent = ''; sheet.appendChild(box);
  }
  var netErr = false;
  function next(i, retried) {
    if (i >= steps.length) return message(netErr ? 'net' : (tok || (guest && dates) ? 'gone' : 'nolink'));
    steps[i]().then(function (data) {
      var F = data && window.StaffloHouseFacts ? window.StaffloHouseFacts.build(data) : null;
      if (F) start(F); else next(i + 1);
    }, function (e) {
      var transient = !e || !e.status || e.status >= 500 || e.status === 429;
      if (transient && !retried) return setTimeout(function () { next(i, true); }, 1200);
      if (transient) netErr = true;
      next(i + 1);
    });
  }
  next(0);
})();
</script>
<script type="text/plain" id="livret-main">
/* ═══ Données de la villa : la fiche maison (window.VILLA_FACTS, chargée ci-dessus) ═══
   Source unique, lue aussi par l'app (ARIA, réponses types). Changer un prix
   ou une règle dans la fiche le change partout, livret compris. */
const {VILLA, PRACTICAL, ROOMS, GOOD_TO_KNOW, MEAL_NOTES, MEALS, LEISURE, RULES, BREAKFAST, BRUNCH, GOUTER, STARTERS, MAINS, SIMPLE, DESSERTS, MEDINA, GOLF, ACTIVITIES, RESTAURANTS, CAFES, TEXT: FACT_TEXT} = window.VILLA_FACTS;
/* Toute villa (15/10/2026) : le livret ne nomme plus le pilote. Nom, hôte, premier contact,

/* Tarif negocie (champ « Tarif négocié » ou ?tarifs=400/400/500[/400]) :
   brunch / dejeuner / diner [/ gouter], pour le groupe. Pour les clients a qui
   un prix a ete annonce avant la grille actuelle (Capucine, Hugo) : le
   livret affiche le prix promis, pas la grille du jour. Vide -> grille
   standard, comportement inchange. */
const MEALS_TARIF = [
  {k:'brunch', n:['Brunch (sur demande)','Brunch (on request)'], h:['Dès 10h30','From 10:30 am']},
  {k:'dej',    n:['Déjeuner (sur demande)','Lunch (on request)'], h:['12h30 – 14h30','12:30 – 2:30 pm']},
  {k:'diner',  n:['Dîner (sur demande)','Dinner (on request)'],   h:['19h30 – 21h30','7:30 – 9:30 pm']}
];
function parseTarifs(raw){
  const n = String(raw || '').split(/[\/;,\s]+/).map(x => parseInt(x, 10)).filter(x => x > 0);
  if (n.length < 3) return null;
  return {brunch:n[0], dej:n[1], diner:n[2], gouter:n[3] || null};
}

/* ═══ Rendu ═══ */
let LANG = 'bi';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapUrl = n => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(n + (VCITY ? ' ' + VCITY : ''));
/* wa.me veut le numero international sans + ni espaces ; "(0)" est un prefixe
   de composition nationale, pas un chiffre du numero -> retire avant le strip. */
const waDigits = raw => raw.replace(/\(0\)/g, '').replace(/\D/g, '');
const waLink = raw => 'https://wa.me/' + waDigits(raw);
/* Linkifie en tel: les numeros deja presents dans un texte deja echappe
   (aucun caractere de ces numeros n'a besoin d'echappement HTML). */
const linkifyTel = html => html.replace(/\+\d[\d \-]{5,}\d/g,
  m => '<a href="tel:+' + m.replace(/\D/g, '') + '">' + m + '</a>');

/* t([fr,en]) — rend selon la langue ; en bilingue, l'anglais passe sous le français,
   et disparaît quand les deux textes sont identiques. */
/* Un saut de ligne litteral dans les donnees devient un <br> a l'affichage.
   Les textes passent par esc(), on ne peut donc pas y ecrire la balise
   directement : la conversion se fait apres echappement. Cela permet d'aerer
   les blocs de trois ou quatre phrases sans toucher a leur contenu. */
const br = txt => esc(txt).replace(/\n/g, '<br>');
/* Un anglais absent ou vide (fiche remplie en français seulement) reprend le français. */
const enOf = pair => (pair[1] === undefined || pair[1] === '') ? pair[0] : pair[1];
function t(pair, tag){
  if (!Array.isArray(pair)) pair = [String(pair == null ? '' : pair)];
  const fr = pair[0], en = enOf(pair);
  if (LANG === 'fr') return br(fr);
  if (LANG === 'en') return br(en);
  if (fr === en) return br(fr);
  return br(fr) + '<span class="en">' + br(en) + '</span>';
}
/* version courte pour les libellés inline (titres de tableau, etc.) */
function ti(pair){
  if (!Array.isArray(pair)) pair = [String(pair == null ? '' : pair)];
  const fr = pair[0], en = enOf(pair);
  if (LANG === 'fr') return esc(fr);
  if (LANG === 'en') return esc(en);
  return fr === en ? esc(fr) : esc(fr) + ' / ' + esc(en);
}
const listOf = arr => '<ul>' + arr.map(x => '<li>' + t(x) + '</li>').join('') + '</ul>';

/* Lignes "etiquette : valeur" — Menage, Blanchisserie, Deplacements...
   L'etiquette passe en gras pour qu'on la repere en balayant la page au lieu
   de lire chaque ligne. Le gras est applique APRES echappement : t() passe le
   texte dans esc(), on ne peut donc pas injecter la balise avant.
   En bilingue, seule la ligne francaise est mise en gras : la traduction est
   deja distinguee par son italique, la doubler alourdirait. */
/* Met en valeur ce qu'on cherche en parcourant une ligne : un prix, une
   heure, un delai. Volontairement restreint — si tout est en gras, plus rien
   ne l'est. Applique APRES l'etiquette pour ne jamais imbriquer deux balises. */
const EMPH = [
  /* Exclut tout MAD suivi de "par personne"/"per person" : la fourchette
     fixe "40 a 80 MAD par personne selon les plats" (MEAL_NOTES) et celle
     dynamique de mealEstimateText() sont toutes deux gerees par les regex
     dediees plus bas, jamais par ce regex generique (sinon double gras
     imbrique, ou gras isole sur la borne haute de la fourchette fixe). */
  /(\d{1,4}\s?MAD)(?! par personne)(?! per person)/g, // 400 MAD
  /(\d{1,2}h(?:\d{2})?)/g,                   // 9h00, 16h, 10h30
  /(\d{1,2}(?::\d{2})?\s?(?:am|pm))/gi,      // 9:00 am, 4 pm
  /(\d{1,2}\s?h\b)/g,                        // 48 h
  /(\b(?:la veille|the day before)\b)/gi,
  /(\b(?:2 jours à l'avance|2 days ahead)\b)/gi,
  /((?:(?:2|Deux|deux) jours avant votre arrivée|(?:2|Two|two) days before you arrive))/g,
  /(Vous arrivez à temps pour le goûter ou le dîner\s?\?|Arriving in time for afternoon tea or dinner\?)/g,
  /(\b(?:chaque jour|every day)\b)/gi,
  /(\b(?:une fois par semaine|once a week)\b)/gi,
  /(\b10 (?:personnes|people)\b)/gi,
  /(une entrée, un plat et un dessert|one starter, one main and one dessert)/gi,
  /(toute allergie ou restriction alimentaire|any allergies or dietary restrictions)/gi,
  /((?:deux|two) (?:nourrissons|infants)(?: en berceau| in cots)?)/gi,
  /* Fourchette de mealEstimateText() uniquement — le lookahead sur la suite
     de phrase l'isole de la fourchette fixe "40 à 80 MAD par personne" du
     premier MEAL_NOTES, qui elle ne doit pas passer en gras. */
  /(\d{1,4} à \d{1,4} MAD par personne)(?=, courses comprises)/g,
  /(\d{1,4} to \d{1,4} MAD per person)(?=, groceries included)/g
];
function emph(txt){
  let out = txt;
  EMPH.forEach(re => { out = out.replace(re, '<strong>$1</strong>'); });
  /* garde-fou : jamais deux <strong> imbriques */
  return out.replace(/<strong>([^<]*)<strong>/g, '<strong>$1').replace(/<\/strong><\/strong>/g, '</strong>');
}
function labelled(escaped){
  const m = escaped.match(/^([^:]{2,40}\s*:)/);
  return m ? '<strong>' + m[1] + '</strong>' + emph(escaped.slice(m[1].length))
           : emph(escaped);
}
function tLabelled(pair){
  const fr = pair[0], en = enOf(pair);
  if (LANG === 'fr') return labelled(br(fr));
  if (LANG === 'en') return labelled(br(en));
  if (fr === en)     return labelled(br(fr));
  return labelled(br(fr)) + '<span class="en">' + br(en) + '</span>';
}
const listOfLabelled = arr => '<ul>' + arr.map(x => '<li>' + tLabelled(x) + '</li>').join('') + '</ul>';
const colsOf = arr => '<ul class="cols">' + arr.map(x => '<li>' + t(x) + '</li>').join('') + '</ul>';

function linksOf(arr){
  return '<ul class="links">' + arr.map(x =>
    '<li><b>' + ti(x.n) + '</b> — ' + linkifyTel(t(x.d)) +
    ' <a href="' + mapUrl(x.n[0]) + '" target="_blank" rel="noopener">' + ti(T.map) + '</a>' +
    (x.url ? ' · <a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + ti(T.site) + '</a>' : '') +
    '</li>'
  ).join('') + '</ul>';
}



/* Estimation par personne — depend du groupe (pax), absent de l'URL -> se
   comporte comme avant (groupe de 8, 145 a 185 MAD). Arrondi au 5 MAD le
   plus proche : au 10 le plus proche, le groupe de 10 (prep 850) retombe
   sur 130-170 au lieu du 125-165 attendu. */
/* Prix de préparation lus dans la fiche (2e ligne des repas : brunch / déjeuner / dîner) ;
   sans prix chiffré, pas d'estimation. */
const PREP = (() => { const m = MEALS[1]; const n = v => parseInt(String(Array.isArray(v) ? v[0] : v || '').replace(/\s/g, ''), 10); return m ? {a: n(m.a), b: n(m.b)} : null; })();
function mealEstimateText(pax, tarifs){
  const p = pax ? parseInt(pax, 10) : 8;
  /* Fourchette de courses par personne : celle écrite dans la première note des repas
     (« environ 40 à 80 MAD par personne ») — rien en dur. Sans elle, pas d'estimation. */
  const gm = /(\d{1,4})\s*(?:à|to)\s*(\d{1,4})\s*MAD\s*(?:par personne|per person)/.exec(String((MEAL_NOTES[0] || [''])[0]));
  if (!gm || !(tarifs || (PREP && PREP.a > 0 && PREP.b > 0))) return ['', ''];
  const prep = PREP ? (p <= 6 ? PREP.a : PREP.b) : 0;
  /* Tarif negocie : fourchette du repas le moins cher au plus cher. */
  const lo = tarifs ? Math.min(tarifs.brunch, tarifs.dej, tarifs.diner) : prep;
  const hi = tarifs ? Math.max(tarifs.brunch, tarifs.dej, tarifs.diner) : prep;
  const bas  = Math.round((lo + p * +gm[1]) / p / 5) * 5;
  const haut = Math.round((hi + p * +gm[2]) / p / 5) * 5;
  return [
    ' À titre indicatif, pour un groupe de ' + p + ', un repas revient à environ ' + bas + ' à ' + haut + ' MAD par personne, courses comprises.',
    ' As a guide, for a group of ' + p + ', a meal comes to about ' + bas + ' to ' + haut + ' MAD per person, groceries included.'
  ];
}

/* Salutation : prenom seul (« Arnaud Delorme » -> « Arnaud »), sauf si le
   champ Client nomme deja plusieurs personnes (« Clara & Francesca »), garde
   alors tel quel. Groupe famille / amis -> suffixe chaleureux (T.hiGroup). */
function greetName(guest){
  if (/[&,+]|\s(et|and)\s/i.test(guest)) return guest;
  return guest.split(/\s+/)[0];
}
function greeting(guest, grp){
  const name = greetName(guest);
  const suf = T.hiGroup[grp];
  if (!suf) return ti(T.hi) + ' ' + esc(name) + ',';
  return t([T.hi[0] + ' ' + name + suf[0] + ',', T.hi[1] + ' ' + name + suf[1] + ',']);
}

/* Encadre enfants : seuls le nom du lieu et la condition de reservation passent
   en gras — pas emph(), dont les quatre creneaux horaires en gras noieraient le
   nom. Le gras et le lien sont poses APRES echappement par t(), comme ailleurs. */
const PERLE_BOOK = {fr:'https://laperleauxoiseaux.com/#reserver', en:'https://laperleauxoiseaux.com/en#reserver'};
function kidsBoxHtml(){
  return t(T.kidsBox)
    .replace(/La Perle aux Oiseaux/g, '<strong>La Perle aux Oiseaux</strong>')
    .replace(/(uniquement sur réservation|by booking only)/gi, '<strong>$1</strong>')
    .replace(/laperleauxoiseaux\.com(\/en)?/g, (m, en) =>
      '<a href="' + (en ? PERLE_BOOK.en : PERLE_BOOK.fr) + '" target="_blank" rel="noopener">' + m + '</a>');
}

/* « Votre arrivée » — seulement avec un lien personnel (jeton) : sans jeton, personne à qui transmettre.
   Les réponses partent à livret-view, qui les range sur CE séjour. Jamais à l'impression. */
function orderSentLine(o){ return o && o.total > 0 ? '<p class="st">' + ti(T.ordSent) + ' ' + esc((Math.round(o.total * 100) / 100).toLocaleString(LANG === 'en' ? 'en-GB' : 'fr-FR') + (o.cur ? ' ' + o.cur : '')) + '</p>' : ''; }
function arrivalBlock(){
  const ctx = window.LIVRET_CTX;
  if (!ctx || !ctx.token) return '';
  const a = ctx.answers || {};
  const v = x => esc(x == null ? '' : x);
  const sentLine = a.at ? '<p class="st">' + ti(T.arrSentOn) + ' ' + esc(new Date(a.at).toLocaleDateString(LANG === 'en' ? 'en-GB' : 'fr-FR', {day:'numeric', month:'long'})) + '</p>' : '';
  return '<form class="arrive" id="arrive" autocomplete="off">' +
    '<h3>' + ti(T.arrTitle) + '</h3><p class="why">' + t(T.arrWhy) + '</p>' +
    '<label for="ar-time">' + t(T.arrTime) + '</label><input id="ar-time" type="text" maxlength="120" value="' + v(a.arrival_time) + '" placeholder="' + ti(T.arrTimePh) + '">' +
    '<div class="two"><div><label for="ar-c">' + t(T.arrCouples) + '</label><input id="ar-c" type="number" inputmode="numeric" min="0" max="20" value="' + v(a.couples) + '"></div>' +
    '<div><label for="ar-s">' + t(T.arrSingles) + '</label><input id="ar-s" type="number" inputmode="numeric" min="0" max="20" value="' + v(a.singles) + '"></div></div>' +
    '<label for="ar-m">' + t(T.arrMeals) + '</label><textarea id="ar-m" maxlength="600" placeholder="' + ti(T.arrMealsPh) + '">' + v(a.meals) + '</textarea>' +
    orderBlock() +
    '<button type="submit" class="send" id="ar-send">' + ti(T.arrSend) + '</button>' +
    '<div id="ar-st">' + sentLine + orderSentLine(ctx.orders) + '</div></form>';
}
/* ── Commande avant l'arrivée (15/10/2026) : repas chiffrés de la fiche + extras (fiche EXTRAS).
   Prix de la fiche ; le serveur (livret-view) les recalcule et ne garde que l'id et la quantité.
   Rien n'est payé ici : le propriétaire confirme. */
const priceOf = v => { if (typeof v === 'number') return v > 0 ? v : null; const m = /(\d+(?:[.,]\d{1,2})?)/.exec(String(Array.isArray(v) ? v[0] : v == null ? '' : v).replace(/\s/g, '')); const n = m ? parseFloat(m[1].replace(',', '.')) : NaN; return isFinite(n) && n > 0 ? n : null; };
const CUR = (() => { const v = String(VILLA.currency || '').trim(); if (v) return v; for (const m of MEALS) { const x = /\d\s*([A-Za-z€$£]{1,4})\b|\d\s*([€$£])/.exec(String(Array.isArray(m.a) ? m.a[0] : m.a || '')); if (x) return x[1] || x[2]; } return ''; })();
const money = v => (Math.round(v * 100) / 100).toLocaleString(LANG === 'en' ? 'en-GB' : 'fr-FR') + (CUR ? ' ' + CUR : '');
const orderPax = () => parseInt(document.getElementById('p').value, 10) || 0;
function orderMenu(){
  const pax = orderPax(), out = [];
  MEALS.forEach((m, i) => { const unit = priceOf(pax >= 7 ? (m.b != null ? m.b : m.a) : m.a) || priceOf(m.a); if (unit) out.push({id:'m' + i, kind:'meal', n:m.n, unit}); });
  (window.VILLA_FACTS.EXTRAS || []).forEach((x, i) => { const unit = priceOf(x && x.price); if (unit && x.n) out.push({id:'x' + i, kind:'extra', n:x.n, unit, per:x.unit, d:x.d}); });
  return out;
}
const ORDER = {};
(((window.LIVRET_CTX || {}).orders || {}).items || []).forEach(x => { if (x && x.id) ORDER[x.id] = +x.q || 0; });
const orderTotal = () => orderMenu().reduce((t, m) => t + m.unit * (ORDER[m.id] || 0), 0);
function orderBlock(){
  const menu = orderMenu();
  if (!menu.length) return '';
  const meals = menu.some(m => m.kind === 'meal');
  let h = '<div class="ord" id="ord"><h3>' + ti(T.ordTitle) + '</h3><p class="why">' + t(T.ordWhy) + (meals && MEAL_NOTES[0] ? '<br>' + t(MEAL_NOTES[0]) : '') + '</p>';
  menu.forEach(m => {
    const per = m.kind === 'meal' ? ti(T.ordPerGroup) : (m.per ? ti(m.per) : '');
    h += '<div class="ord-row"><div class="ord-n"><b>' + ti(m.n) + '</b><span>' + esc(money(m.unit)) + (per ? ' · ' + per : '') + (m.d ? '<br>' + ti(m.d) : '') + '</span></div>' +
      '<div class="step"><button type="button" data-ord="-1" data-id="' + m.id + '" aria-label="−">−</button><output id="oq-' + m.id + '">' + (ORDER[m.id] || 0) + '</output>' +
      '<button type="button" data-ord="1" data-id="' + m.id + '" aria-label="+">+</button></div></div>';
  });
  return h + '<div class="ord-tot"><span>' + ti(T.ordTotal) + '</span><b id="ord-tot">' + esc(money(orderTotal())) + '</b></div></div>';
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-ord]'); if (!b) return;
  const id = b.getAttribute('data-id'); ORDER[id] = Math.max(0, Math.min(30, (ORDER[id] || 0) + (+b.getAttribute('data-ord'))));
  const o = document.getElementById('oq-' + id); if (o) o.textContent = ORDER[id];
  const tt = document.getElementById('ord-tot'); if (tt) tt.textContent = money(orderTotal());
});
function sendArrival(form){
  const ctx = window.LIVRET_CTX, btn = form.querySelector('#ar-send'), st = form.querySelector('#ar-st');
  const g = id => form.querySelector('#' + id).value;
  const answers = { arrival_time: g('ar-time').trim(), couples: g('ar-c').trim(), singles: g('ar-s').trim(), meals: g('ar-m').trim() };
  const hasMenu = orderMenu().length, lines = Object.keys(ORDER).filter(k => ORDER[k] > 0).map(k => ({ id: k, q: ORDER[k] }));
  const hadOrder = !!(ctx.orders && ctx.orders.items && ctx.orders.items.length);
  if (!answers.arrival_time && !answers.couples && !answers.singles && !answers.meals && !lines.length && !hadOrder) return;
  const payload = { t: ctx.token, lang: LANG === 'en' ? 'en' : 'fr' };
  if (answers.arrival_time || answers.couples || answers.singles || answers.meals) payload.answers = answers;
  if (hasMenu && (lines.length || hadOrder)) payload.orders = lines;
  btn.disabled = true; btn.textContent = ti(T.arrSending); st.innerHTML = '';
  fetch(ctx.url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(b => { ctx.answers = b.answers || answers; if (b.orders) ctx.orders = b.orders; st.innerHTML = '<p class="st">' + t(T.arrDone) + '</p>' + orderSentLine(b.orders); })
    .catch(() => { st.innerHTML = '<p class="st err">' + t(T.arrErr) + '</p>'; })
    .then(() => { btn.disabled = false; btn.textContent = ti(T.arrSend); });
}
document.addEventListener('submit', e => { if (e.target && e.target.id === 'arrive') { e.preventDefault(); sendArrival(e.target); } });

/* ── Fiches voyageurs (15/10/2026) — lien personnel + villa qui les demande (VILLA.guest_registration).
   Envoyées à livret-view, chiffrées côté serveur, JAMAIS renvoyées à la page (un lien transféré ne montre
   pas les passeports). L'état vit ici (REG), pas dans le DOM : un nouveau rendu ne perd rien. */
const REG = [];
const REG_F = [['last','regLast'], ['first','regFirst'], ['birth_date','regBirth','date'], ['birth_place','regBirthPlace'], ['nationality','regNat'], ['doc_type','regDocType','select'], ['doc_no','regDocNo'], ['profession','regJob'], ['address','regAddr']];
const regOn = () => { const c = window.LIVRET_CTX; return !!(c && c.token && VILLA.guest_registration === true); };

function regSentLine(r){ return r && r.count ? '<p class="st">' + ti(T.regSentOn) + ' ' + esc(regDay(r.at)) + ' · ' + r.count + ' ' + ti(r.count > 1 ? T.regPeople : T.regPerson) + '</p><p class="why" style="margin:6px 0 0">' + t(T.regRedo) + '</p>' : ''; }

  let h = '<details class="reg-p"' + (i === 0 || nm ? ' open' : '') + '><summary>' + ti(T.regWho) + ' ' + (i + 1) + (nm ? ' — ' + esc(nm) : '') + '</summary>';
  REG_F.forEach(([k, lab, type]) => {

    if (type === 'select') h += '<select id="' + id + '" data-reg="' + i + '.' + k + '"><option value=""></option>' + [['passport', T.regPassport], ['id_card', T.regIdCard], ['other', T.regOther]].map(([val, l]) => '<option value="' + val + '"' + (o[k] === val ? ' selected' : '') + '>' + ti(l) + '</option>').join('') + '</select>';
    else h += '<input id="' + id + '" data-reg="' + i + '.' + k + '" type="' + (type || 'text') + '" maxlength="' + (k === 'address' ? 160 : 80) + '" value="' + v(o[k]) + '"' + (k === 'doc_no' ? ' autocapitalize="characters"' : '') + '>';
  });
  return h + '</details>';

function regBlock(){
  if (!regOn()) return '';

  return '<form class="arrive reg" id="reg" autocomplete="off"><h3>' + ti(T.regTitle) + '</h3><p class="why">' + t(T.regWhy) + '</p>' +

const regKeep = e => { const k = e.target && e.target.getAttribute && e.target.getAttribute('data-reg'); if (!k) return; const [i, f] = k.split('.'); (REG[+i] = REG[+i] || {})[f] = e.target.value; };
document.addEventListener('input', regKeep); document.addEventListener('change', regKeep);

  REG.push({}); const f = document.getElementById('reg'); if (f) f.outerHTML = regBlock();
  const d = document.querySelectorAll('#reg .reg-p'); if (d.length) { d[d.length - 1].open = true; const x = d[d.length - 1].querySelector('input'); if (x) x.focus(); }
});
function sendReg(form){
  const ctx = window.LIVRET_CTX, btn = form.querySelector('#rg-send'), st = form.querySelector('#rg-st');
  const list = REG.filter(o => String(o.last || '').trim() || String(o.first || '').trim());

/* Pré-remplissage depuis l'URL — permet l'ouverture directe depuis une fiche
   client Stafflo : livret.html?guest=Sofia&dates=28%20JUL%20–%201%20AOU%2026&pax=12&groupe=famille&lang=bi
   Chaque paramètre est optionnel ; absent, le champ garde sa valeur par défaut. */
(function prefillFromUrl(){
  const q = new URLSearchParams(location.search);
  const set = (id, key) => {
    const v = q.get(key);
    if (v !== null && v !== '') document.getElementById(id).value = v;
  };
  set('g','guest'); set('d','dates'); set('p','pax'); set('tr','tarifs');
  const gr = (q.get('groupe') || q.get('group') || '').toLowerCase();
  const GR = {famille:'famille', family:'famille', amis:'amis', friends:'amis'};
  if (GR[gr]) document.getElementById('grp').value = GR[gr];
  const l = q.get('lang');
  if (l && ['fr','en','bi'].includes(l)) document.getElementById('l').value = l;
  /* ?print=1 ouvre directement la fenêtre d'impression, une fois le rendu fait. */
  if (q.get('print') === '1') setTimeout(() => {
    if (typeof printWithName === 'function') printWithName(); else window.print();
  }, 600);
})();

['g','d','p','tr','grp','l'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));

/* Nom du PDF — les navigateurs reprennent document.title comme nom de fichier
   par defaut a l'impression. On le remplace juste avant d'imprimer, puis on le
   restaure : l'onglet garde son titre normal le reste du temps.
   Forme : Prenom_29SEP-2OCT26_10pers
   Les caracteres interdits dans un nom de fichier (/ \ : * ? " < > |) sont
   retires, les tirets longs ramenes a un tiret simple, les espaces supprimes
   — sinon Chrome et Safari les remplacent chacun a leur maniere. */
const DEFAULT_TITLE = document.title;

function pdfFilename(){
  const clean = v => String(v || '').trim()
    .replace(/[\u2013\u2014]/g, '-')
    .replace(/[\/\\:*?"<>|]/g, '')
    .replace(/\s+/g, '');
  const g = clean(document.getElementById('g').value);
  const d = clean(document.getElementById('d').value);
  const p = clean(document.getElementById('p').value);
  const parts = [g, d, p ? p + 'pers' : ''].filter(Boolean);
  return parts.length ? parts.join('_') : DEFAULT_TITLE;
}

function printWithName(){
  document.title = pdfFilename();
  window.print();
}
/* Restaure apres coup. afterprint n'est pas emis partout (Safari ancien) :
   le setTimeout sert de filet, il ne gene pas si l'evenement arrive. */
window.addEventListener('afterprint', () => { document.title = DEFAULT_TITLE; });
/* Cmd+P direct, sans passer par le bouton. */
window.addEventListener('beforeprint', () => { document.title = pdfFilename(); });

document.getElementById('print').addEventListener('click', () => {
  printWithName();
  setTimeout(() => { document.title = DEFAULT_TITLE; }, 3000);
});
render();
