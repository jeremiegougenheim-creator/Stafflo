<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livret d'accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2318;
  --ink-soft:#2C4438;
  --cream:#FAF6EE;
  --paper:#FFFCF5;
  --gold:#C9963A;
  --terracotta:#B5533A;
  --rule:rgba(15,35,24,.14);
  --muted:#6B6760;
  --serif:'Noto Serif Display',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#E8E2D6;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ───────── Barre d'édition (écran seulement) ───────── */
/* Lien personnel ouvert par le client (sans session propriétaire) : la barre d'édition
   (nom, dates, tarif négocié, PDF) est l'outil du propriétaire — jamais montrée au client. */
html.guest .bar{display:none}
.bar{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--cream);
     padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
     box-shadow:0 2px 20px rgba(15,35,24,.3)}
.bar h1{font-family:var(--serif);font-size:17px;font-weight:500;margin:0 18px 0 0;
        letter-spacing:.4px;align-self:center;white-space:nowrap}
.bar h1 span{color:var(--gold)}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(250,246,238,.55);font-weight:500}
.f input,.f select{font-family:var(--sans);font-size:13.5px;padding:7px 10px;border-radius:6px;
      border:1px solid rgba(250,246,238,.22);background:rgba(250,246,238,.08);color:var(--cream);min-width:130px}
.f input:focus,.f select:focus{outline:2px solid var(--gold);outline-offset:1px}
.f select option{background:var(--ink);color:var(--cream)}
.btn{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:8px 18px;border-radius:6px;
     border:1px solid var(--gold);background:var(--gold);color:var(--ink);cursor:pointer}
.btn:hover{background:#d9a749}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover{background:rgba(201,150,58,.14)}
.bar .spacer{flex:1}
.hint{width:100%;font-size:11.5px;color:rgba(250,246,238,.5);margin-top:2px}
/* Personnes non connue depuis la réservation : mise en évidence écran
   uniquement (la barre est déjà display:none à l'impression, cf. @media print). */
.f.is-missing input{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,150,58,.35)}
.f.is-missing label::after{content:" — à compléter";color:var(--gold);text-transform:none;letter-spacing:0}

/* ───────── Le livret ───────── */
.sheet{max-width:820px;margin:26px auto;background:var(--paper);padding:52px 60px 46px;
       box-shadow:0 8px 40px rgba(15,35,24,.16)}
.page+.page{margin-top:28px;padding-top:28px;border-top:1px dashed var(--rule)}

.cover{text-align:center;padding:18px 0 30px}
.eyebrow{font-family:var(--sans);font-size:10.5px;letter-spacing:4.5px;text-transform:uppercase;color:var(--muted)}
.cover .villa{font-family:var(--serif);font-size:50px;font-weight:400;margin:12px 0 8px;line-height:1.05}
.diamonds{color:var(--gold);letter-spacing:9px;font-size:12px;margin:6px 0 14px}
.cover .stay{font-family:var(--sans);font-size:12.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--ink-soft)}

.hello{font-family:var(--serif);font-size:22px;margin:26px 0 8px}
.lede{font-size:13.5px;line-height:1.7;color:var(--ink-soft);max-width:60ch}

.infobox{background:var(--cream);border-left:3px solid var(--gold);padding:16px 20px;margin:24px 0 8px}
/* « Votre arrivée » : le client répond depuis son lien personnel (écran seulement, jamais imprimé) */
.arrive{background:#fff;border:1.5px solid var(--gold);border-radius:6px;padding:16px 18px;margin:22px 0 6px}
.arrive h3{margin:0 0 4px;font-family:var(--serif);font-size:20px;font-weight:500}
.arrive .why{font-size:12.5px;line-height:1.6;color:var(--muted);margin:0 0 12px}
.arrive label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.arrive input,.arrive textarea{width:100%;box-sizing:border-box;border:1px solid var(--rule);border-radius:4px;padding:9px 10px;font:inherit;font-size:14px;color:var(--ink);background:var(--paper)}
.arrive textarea{min-height:72px;resize:vertical}
.arrive .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.arrive .send{margin-top:14px;min-height:44px;padding:0 18px;border:0;border-radius:4px;background:var(--ink);color:var(--cream);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.arrive .send:disabled{opacity:.5;cursor:default}
.arrive .st{margin:10px 0 0;font-size:13px;font-weight:600;color:#1F6B47}.arrive .st.err{color:var(--terracotta)}
.arrive .en{display:block;font-style:italic;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
/* Commande avant l'arrivée (15/10/2026) */
.arrive .ord{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.arrive .ord-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule)}
.arrive .ord-n{display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0}.arrive .ord-n span{font-size:12.5px;color:var(--muted);line-height:1.45}
.arrive .step{display:flex;align-items:center;gap:6px;flex-shrink:0}
.arrive .step button{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);font:inherit;font-size:18px;line-height:1;cursor:pointer;color:var(--ink)}
.arrive .step output{min-width:24px;text-align:center;font-weight:600;font-size:15px}
.arrive .ord-days{flex-direction:column;align-items:stretch}.arrive .ord-days .ord-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.arrive .ord-cal{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.arrive .ord-grid{display:grid;gap:5px 6px;align-items:center;margin-top:8px;max-width:520px}.arrive .og-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}.arrive .og-d{font-size:13px;white-space:nowrap;padding-right:4px}.arrive .oc.cell{min-height:38px;padding:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}.arrive .oc{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--rule);background:var(--paper);font:inherit;font-size:13px;color:var(--ink);cursor:pointer}.arrive .oc.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.arrive .ord-q{font-weight:600;font-size:14px;white-space:nowrap}
.arrive .ord-cat{margin:16px 0 2px;font-family:var(--serif);font-size:17px;font-weight:500}
.arrive .ord-when{margin-top:6px}.arrive .ord-when .why{margin:4px 0 0}.arrive .ord-when .need{color:var(--terracotta)}
.arrive .prog{margin:12px 0 14px;padding:12px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.arrive .prog h4{margin:0 0 2px;font-family:var(--serif);font-size:17px;font-weight:500}.arrive .prog .why{margin:0 0 8px}
.arrive .pg-d{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--rule);font-size:13.5px;line-height:1.5}
.arrive .pg-d b{font-weight:600;white-space:nowrap}.arrive .pg-d ul{margin:0;padding:0;list-style:none}.arrive .pg-d li span{color:var(--muted)}
.arrive .ord-tot{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:15px}.arrive .ord-tot b{white-space:nowrap}
.arrive select{width:100%;box-sizing:border-box;border:1px solid var(--rule);border-radius:4px;padding:9px 10px;font:inherit;font-size:14px;color:var(--ink);background:var(--paper)}
/* Fiches voyageurs (déclaration aux autorités) — écran seulement, jamais imprimé */
.arrive .reg-p{border-top:1px solid var(--rule);padding:8px 0}
.arrive .reg-p summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;min-height:32px}
.arrive .add{margin-top:10px;min-height:40px;padding:0 14px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.infobox div{font-size:12.5px;line-height:1.85}
.infobox .k{font-weight:700}

h2{font-family:var(--serif);font-size:22px;font-weight:500;margin:28px 0 6px;
   padding-bottom:7px;border-bottom:1px solid var(--rule)}
h2::before{content:"◆";color:var(--terracotta);font-size:13px;margin-right:9px;vertical-align:2px}
h3{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:2.6px;
   text-transform:uppercase;color:var(--terracotta);margin:12px 0 5px}

ul{margin:9px 0;padding-left:18px}
li{font-size:13px;line-height:1.55;margin-bottom:5px}
p{font-size:13px;line-height:1.6;margin:8px 0}
.en{font-style:italic;color:var(--muted);display:block;font-size:12.2px;line-height:1.5;margin-top:0}

/* Chambres */
.room{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--rule)}
.room:last-child{border-bottom:none}
.rn{font-family:var(--serif);font-size:27px;color:var(--gold);line-height:1;width:34px;flex-shrink:0}
.rb{flex:1;min-width:0}
.rt{font-family:var(--serif);font-size:17px;margin-bottom:5px}
.rd{font-size:12.3px;line-height:1.65;color:var(--ink-soft)}
.rd b{font-family:var(--sans);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tag{display:inline-block;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;
     background:rgba(201,150,58,.16);color:#8a6520;padding:3px 8px;border-radius:3px;margin-bottom:6px}

/* Tableau repas */
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.3px}
th{font-family:var(--sans);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;
   text-align:left;padding:9px 8px;border-bottom:1.5px solid var(--ink);color:var(--ink)}
td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
td:first-child{font-weight:500}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
/* Le contact de l'hote est un recours, pas une alternative : plus petit,
   en gris, detache par un filet. On le trouve si on le cherche, on ne
   tombe pas dessus en lisant le bloc contacts. */
.host-fallback{font-size:11px;color:var(--muted);margin-top:8px;padding-top:7px;
               border-top:1px solid var(--rule);line-height:1.5}
.callout{background:var(--cream);border-left:3px solid var(--gold);padding:10px 14px;margin:10px 0 4px;
         font-size:12px;line-height:1.55;color:var(--ink-soft)}

/* QR WhatsApp — fond blanc garanti derriere le SVG (le fond de page est
   creme/paper, pas blanc pur), break-inside:avoid pour ne jamais couper un
   QR entre deux pages a l'impression. */
.qr-block{display:flex;gap:30mm;margin:14px 0 4px;break-inside:avoid}
.qr-item{text-align:center}
.qr-svg{width:110px;height:110px;background:#fff;display:block}
.qr-cap{font-size:10.5px;color:var(--ink-soft);margin-top:6px}
.qr-note{font-size:11px;color:var(--muted);line-height:1.6;margin:6px 0 4px}
/* QR calculés sur l'appareil (Wi-Fi, livret en ligne) : même taille que les QR WhatsApp, marge blanche autour. */
.qr-block{flex-wrap:wrap;row-gap:14px}
.qr-wifi{max-width:132px}
.qr-wifi svg{width:110px;height:110px;display:block;background:#fff;padding:6px;box-sizing:border-box;margin:0 auto}
.qr-online{display:none}
/* Commodités client — écran seulement : contact, calendrier, itinéraire, mot de passe Wi-Fi */
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 2px;font-size:12.5px;line-height:1.6}
.tools .tool{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--gold);border-radius:999px;padding:6px 13px;text-decoration:none;cursor:pointer;line-height:1.3}
.tools .tool:hover{background:rgba(201,150,58,.14)}
.tools .tool-group{color:var(--ink-soft)}
.tools .tool-group a{font-weight:600}

.cols{column-count:2;column-gap:32px}
.cols li{break-inside:avoid}
.links li{break-inside:avoid;margin-bottom:10px}
a{color:var(--terracotta);text-decoration:none;border-bottom:1px solid rgba(181,83,58,.35)}
.sig{font-family:var(--serif);font-size:19px;margin-top:34px;text-align:right}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--rule);
      font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center}

/* ───────── Impression ───────── */
@page{size:A4;margin:16mm}
@media print{
  body{background:#fff}
  .bar,.hint,.arrive{display:none !important}
  .sheet{max-width:none;margin:0;padding:0;box-shadow:none;background:#fff}
  /* Aucune regle ne redefinit strong ailleurs : on s'appuie donc sur
     font-weight:bolder par defaut du navigateur. A l'impression, certains
     moteurs (Safari notamment) peuvent retomber sur la graisse normale du
     web font sans le signaler par un changement de mise en page — d'ou le
     poids explicite, force, au lieu de compter sur le comportement implicite. */
  strong{font-weight:700 !important}
  /* Le document coule. page-break-after:always forcait une feuille par
     section : les Regles de la maison (5 puces) consommaient une page
     entiere, et la derniere n'avait que trois lignes. C'etait la cause du
     blanc, pas les interlignes. Les sections sont marquees par leurs titres
     et leurs filets, pas par du papier. */
  .page{page-break-after:auto}
  .page+.page{margin-top:14px;padding-top:0;border-top:none}
  /* On empeche seulement les coupures laides : un titre seul en bas de page,
     une ligne orpheline, un bloc chambre ou une ligne de tableau scindee. */
  h2,h3{page-break-after:avoid;break-after:avoid}
  /* table ici en plus de tr : sans ca, tr:avoid empeche une ligne d'etre
     coupee EN DEUX mais laisse le tableau se scinder ENTRE deux lignes, avec
     repetition du thead sur la page suivante — c'est ce qui isolait la ligne
     petit-dejeuner du reste du tableau repas en bilingue. */
  .room,table,tr,li{page-break-inside:avoid;break-inside:avoid}
  p,li{orphans:2;widows:2}
  a{color:var(--terracotta)}

  /* ── Densite d'impression ──────────────────────────────────────────────
     Les espacements ci-dessus sont regles pour l'ecran, ou il faut respirer :
     34px au-dessus de chaque h2, 22px au-dessus de chaque h3, 7px sous chaque
     puce. Applique tel quel au papier, cela gonfle le document sans rien
     apporter. On resserre ici, et ici seulement — la lecture a l'ecran reste
     inchangee. */
  h2{margin:22px 0 5px;font-size:20px;padding-bottom:4px}
  h3{margin:9px 0 4px}
  p{margin:7px 0;line-height:1.48}
  ul{margin:8px 0}
  li{margin-bottom:4px;line-height:1.42}
  .en{line-height:1.4;font-size:11.8px}
  .lede{line-height:1.5}
  .cover{padding:10px 0 18px}
  .cover .villa{font-size:42px;margin:8px 0 6px}
  .hello{margin:18px 0 6px}
  .infobox{margin:16px 0 6px;padding:12px 16px}
  .infobox div{line-height:1.6}
  .qr-svg{width:28mm;height:28mm}
  .qr-wifi svg{width:28mm;height:28mm;padding:1.5mm}
  .qr-block{margin:10px 0 2px;justify-content:center}
  .qr-note{text-align:center}
  /* Écran seulement : les commodités (contact, calendrier, itinéraire) ; imprimé seulement : le QR du livret en ligne */
  .tools{display:none !important}
  .qr-online{display:flex;flex-direction:column;align-items:center;margin:12px 0 4px;break-inside:avoid}
  .qr-online svg{width:26mm;height:26mm;background:#fff;padding:1.5mm;box-sizing:border-box}
  .qr-online .qr-cap{text-align:center;max-width:70mm}
  .room{padding:9px 0}
  table{margin:10px 0}
  th,td{padding:6px 8px}
  .links li{margin-bottom:5px}
  .sig{margin-top:22px}
  .foot{margin-top:18px;padding-top:9px}
}
@media (max-width:700px){
  .sheet{padding:28px 22px;margin:14px 8px}
  .cover .villa{font-size:36px}
  .cols{column-count:1}
  .qr-block{gap:14px 22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div class="bar">
  <h1>Livret <span id="barVilla"></span></h1>
  <div class="f"><label for="g">Client</label><input id="g" value="" autocomplete="off"></div>
  <div class="f"><label for="d">Dates</label><input id="d" value="" autocomplete="off"></div>
  <div class="f" id="pWrap"><label for="p">Personnes</label><input id="p" type="number" min="1" max="10" placeholder="?" style="min-width:80px"></div>
  <div class="f"><label for="tr">Tarif négocié</label><input id="tr" placeholder="brunch/déj/dîner" autocomplete="off" style="min-width:130px"></div>
  <div class="f"><label for="grp">Groupe</label>
    <select id="grp">
      <option value="">—</option>
      <option value="famille">Famille</option>
      <option value="amis">Amis</option>
    </select>
  </div>
  <div class="f"><label for="l">Langue</label>
    <select id="l">
      <option value="bi">Bilingue FR / EN</option>
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="print">Enregistrer en PDF</button>
  <div class="hint">Le bouton ouvre la fenêtre d'impression — choisissez « Enregistrer au format PDF » comme destination. La barre d'édition n'apparaît pas dans le document.</div>
</div>

<div class="sheet" id="sheet"></div>

<script src="house-facts.js"></script>
<!-- QR codes calculés sur l'appareil (Wi-Fi, version en ligne du livret) : qrcode-generator 1.4.4, MIT, servi par le site (assets/vendor/), jamais un CDN. -->
<script src="assets/vendor/qrcode-generator-1.4.4.min.js"></script>
<script>
/* ═══ Fiche maison : en base (villa_settings.house_facts), plus dans le site public ═══
   Le livret la demande, dans cet ordre :
     1. ?t=<jeton> — lien personnel du séjour → fonction livret-view ;
     2. le propriétaire connecté sur ce navigateur (session de l'app) → sa ligne villa_settings ;
     3. ancien lien ?guest=&dates= (livret envoyé avant le 14/10/2026) → livret-view,
        nom et dates exacts, séjour pas terminé.
   Puis le script du livret (#livret-main, inchangé) s'exécute avec window.VILLA_FACTS.
   Sinon : un message clair — jamais une fiche vide ou celle d'une autre villa. */
(function () {
  var SB_URL = 'https://rcjhgilpmojohmrqzokx.supabase.co';
  var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjamhnaWxwbW9qb2htcnF6b2t4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NDg4NzYsImV4cCI6MjA5MDIyNDg3Nn0.J7As0S5aw2ViIyKZXPNH6Kga5IUhn5XCz1khKcul8uQ';
  var q = new URLSearchParams(location.search);
  var tok = q.get('t') || '', guest = q.get('guest') || '', dates = q.get('dates') || '';
  function fail(r) { var e = new Error('http_' + r.status); e.status = r.status; throw e; }
  function view(qs) {
    return fetch(SB_URL + '/functions/v1/livret-view?' + qs, { cache: 'no-store' }).then(function (r) {
      return r.ok ? r.json().then(function (b) { if (b && b.answers) window.LIVRET_CTX.answers = b.answers; if (b && b.orders) window.LIVRET_CTX.orders = b.orders; if (b && b.reg) window.LIVRET_CTX.reg = b.reg; if (b && b.days) window.LIVRET_CTX.days = b.days; if (b && b.stay) window.LIVRET_CTX.stay = b.stay; return b && b.facts; }) : fail(r);
    });
  }
  /* Contexte du séjour pour le bloc « Votre arrivée » : le jeton (s'il y en a un) et ce que le client a déjà répondu. */
  window.LIVRET_CTX = { token: tok, answers: null, url: SB_URL + '/functions/v1/livret-view' };
  function ownerStep() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem('stafflo_session') || 'null'); } catch (e) {}
    if (!s || !s.access_token || !s.user || !s.user.id) return null;
    if (s.expires_at && s.expires_at * 1000 < Date.now() + 30000) return null; // jamais de rafraîchissement ici : la session appartient à l'app
    return function () {

/* Lignes "etiquette : valeur" — Menage, Blanchisserie, Deplacements...

  /(\b(?:2 jours à l'avance|2 days ahead)\b)/gi,
  /((?:(?:2|Deux|deux) jours avant votre arrivée|(?:2|Two|two) days before you arrive))/g,
  /(Vous arrivez à temps pour le goûter ou le dîner\s?\?|Arriving in time for afternoon tea or dinner\?)/g,

function emph(txt){

const PREP = (() => { const m = MEALS[1]; const n = v => parseInt(String(Array.isArray(v) ? v[0] : v || '').replace(/\s/g, ''), 10); return m ? {a: n(m.a), b: n(m.b)} : null; })();

    MEALS.slice(3).forEach(m => { if (mealOff(m, pp)) return; h += '<tr><td>' + ti(m.n) + '</td><td>' + ti(pp <= 6 ? m.a : m.b) + '</td><td>' + ti(m.h) + '</td></tr>'; });
  } else {
  h += '<table><thead><tr><th>' + ti(T.thMeal) + '</th><th>' + ti(T.th16) + '</th><th>' +
       ti(T.th710) + '</th><th>' + ti(T.thHours) + '</th></tr></thead><tbody>';
  MEALS.forEach(m => {
    h += '<tr><td>' + ti(m.n) + '</td><td>' + ti(m.a) + '</td><td>' + (mealOff(m, 7) ? '—' : ti(m.b)) +
         '</td><td>' + ti(m.h) + '</td></tr>';
  });
  }
  const mealNotes = MEAL_NOTES.map(x => x.slice());
  const est = mealEstimateText(pax, tarifs);
  if (mealNotes.length) mealNotes[0] = [mealNotes[0][0] + est[0], (mealNotes[0][1] === undefined ? mealNotes[0][0] : mealNotes[0][1]) + est[1]];
  h += '</tbody></table>' + (mealNotes.length ? '<div class="note">' + listOfLabelled(mealNotes) + '</div>' : '');
  if (T.earlyBrk) h += '<div class="callout">' + emph(t(T.earlyBrk)) + '</div>';
  }
  if (LEISURE.length) h += '<h2>' + ti(T.leisure) + '</h2>' + listOfLabelled(LEISURE);
  h += '</div>';
  }

  /* ── Page 4 : menu ── */
  const MENUS = [[T.brk, BREAKFAST], [T.brunchMenu, BRUNCH], [T.gouter, GOUTER], [T.starters, STARTERS], [T.mains, MAINS], [T.simple, SIMPLE], [T.desserts, DESSERTS]].filter(x => x[1].length);
  if (MENUS.length) {
  h += '<div class="page"><h2>' + ti(T.menu) + '</h2>';
  if (T.menuIntro) h += '<p>' + emph(t(T.menuIntro)) + '</p>';
  if (T.menuNote) h += '<p>' + t(T.menuNote) + '</p>';
  MENUS.forEach(x => { h += '<h3>' + ti(x[0]) + '</h3>' + listOf(x[1]); });
  h += '</div>';
  }

  /* ── Page 5 : la ville ── */
  const AROUND = MEDINA.length + GOLF.length + ACTIVITIES.length + RESTAURANTS.length + CAFES.length;
  h += '<div class="page">';
  if (AROUND) {
  h += '<h2>' + ti(T.discover) + '</h2>';
  if (MEDINA.length) h += '<h3>' + ti(T.medina) + '</h3>' + linksOf(MEDINA);
  /* Encart Majorelle : seulement avec une médina listée à Marrakech (texte de la page, pas de la fiche). */
  if (MEDINA.length && VCITY === 'Marrakech') h += '<h3>' + ti(T.ysl) + '</h3><p>' + t(T.yslTxt) +
       ' <a href="https://www.jardinmajorelle.com/" target="_blank" rel="noopener">' + ti(T.tickets) + '</a></p>';
  if (GOLF.length) h += '<h3>' + ti(T.golf) + '</h3>' + linksOf(GOLF);
  if (ACTIVITIES.length) h += '<h3>' + ti(T.activities) + '</h3>' + linksOf(ACTIVITIES);
  if (RESTAURANTS.length) h += '<h3>' + ti(T.restaurants) + '</h3>' + linksOf(RESTAURANTS);
  if (CAFES.length) h += '<h3>' + ti(T.cafes) + '</h3><ul class="links">' +
       CAFES.map(c => '<li><b>' + esc(c[0]) + '</b> <a href="' + mapUrl(c[0]) +
         '" target="_blank" rel="noopener">' + ti(T.map) + '</a>' +
         (c[1] ? ' · <a href="' + esc(c[1]) + '" target="_blank" rel="noopener">' + ti(T.site) + '</a>' : '') +
         '</li>').join('') + '</ul>';
  }
  if (T.kidsBox) h += '<div class="callout">' + kidsBoxHtml() + '</div>';
  h += '<div class="sig">' + t(T.bye) + (HOST ? '<br>' + esc(HOST) : '') + '</div>';
  /* QR « ce livret en ligne » (18/10) : imprimé seulement, avec le lien personnel du séjour — jamais sur un livret sans jeton. */
  const ONLINE_QR = qrSvg(onlineLivretUrl());
  if (ONLINE_QR) h += '<div class="qr-online" id="livret-qr-online">' + ONLINE_QR + '<div class="qr-cap">' + t(T.qrOnline) + '</div></div>';
  h += '<div class="foot">' + esc([VNAME, VCITY].filter(Boolean).join(' · ')) + '</div>';
  /* Signature discrète : les invités d'une villa sont souvent eux-mêmes propriétaires. */
  h += '<div class="foot foot-stafflo">' + ti(['Livret préparé avec', 'Guest booklet made with']) + ' <a href="https://stafflo.app/" target="_blank" rel="noopener">Stafflo</a></div></div>';

  document.getElementById('sheet').innerHTML = h;
  /* « Copier le mot de passe » Wi-Fi : presse-papiers, confirmation deux secondes ; sans presse-papiers, rien ne casse. */
  const cw = document.getElementById('copy-wifi');
  if (cw) cw.addEventListener('click', () => {
    const done = () => { const l = cw.textContent; cw.textContent = LANG === 'en' ? T.copied[1] : T.copied[0]; setTimeout(() => { cw.textContent = l; }, 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(cw.getAttribute('data-pass') || '').then(done, () => {});
  });
}

/* Pré-remplissage depuis l'URL — permet l'ouverture directe depuis une fiche
   client Stafflo : livret.html?guest=Sofia&dates=28%20JUL%20–%201%20AOU%2026&pax=12&groupe=famille&lang=bi
   Chaque paramètre est optionnel ; absent, le champ garde sa valeur par défaut. */
(function prefillFromUrl(){
  const q = new URLSearchParams(location.search);
  const set = (id, key) => {
    const v = q.get(key);
    if (v !== null && v !== '') document.getElementById(id).value = v;
  };
  set('g','guest'); set('d','dates'); set('p','pax'); set('tr','tarifs');
  /* Lien court (jeton seul, 18/10) : prénom, dates et nombre viennent du séjour (livret-view), plus de l'adresse.
     Un paramètre présent dans l'adresse garde la main (anciens liens, propriétaire qui essaie). */
  const C = window.LIVRET_CTX || {}, st = C.stay || {}, dy = C.days || {};
  // 22/10/2026 : le contact du séjour quand ce n'est pas le réservant (« Seán & Lise » — c'est Lise qui organise)
  if (!q.get('guest') && st.name) { const f0 = String(st.name).trim().split(/\s+/)[0]; document.getElementById('g').value = st.contact && String(st.contact).toLowerCase() !== f0.toLowerCase() ? f0 + ' & ' + st.contact : st.name; }
  if (!q.get('pax') && st.pax > 0) document.getElementById('p').value = String(st.pax);
  if (!q.get('dates') && /^\d{4}-\d{2}-\d{2}$/.test(dy.from || '') && /^\d{4}-\d{2}-\d{2}$/.test(dy.to || '')) {
    const M = ['JAN','FEV','MAR','AVR','MAI','JUN','JUL','AOU','SEP','OCT','NOV','DEC'], a = new Date(dy.from + 'T12:00:00'), d = new Date(dy.to + 'T12:00:00');
    if (!isNaN(a) && !isNaN(d)) document.getElementById('d').value = a.getDate() + ' ' + M[a.getMonth()] + ' – ' + d.getDate() + ' ' + M[d.getMonth()] + ' ' + String(d.getFullYear()).slice(-2);
  }
  const gr = (q.get('groupe') || q.get('group') || '').toLowerCase();
  const GR = {famille:'famille', family:'famille', amis:'amis', friends:'amis'};
  if (GR[gr]) document.getElementById('grp').value = GR[gr];
  const l = q.get('lang');
  if (l && ['fr','en','bi'].includes(l)) document.getElementById('l').value = l;
  /* ?print=1 ouvre directement la fenêtre d'impression, une fois le rendu fait. */
  if (q.get('print') === '1') setTimeout(() => {
    if (typeof printWithName === 'function') printWithName(); else window.print();
  }, 600);
})();

['g','d','p','tr','grp','l'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));

/* Nom du PDF — les navigateurs reprennent document.title comme nom de fichier
   par defaut a l'impression. On le remplace juste avant d'imprimer, puis on le
   restaure : l'onglet garde son titre normal le reste du temps.
   Forme : Prenom_29SEP-2OCT26_10pers
   Les caracteres interdits dans un nom de fichier (/ \ : * ? " < > |) sont
   retires, les tirets longs ramenes a un tiret simple, les espaces supprimes
   — sinon Chrome et Safari les remplacent chacun a leur maniere. */
const DEFAULT_TITLE = document.title;

function pdfFilename(){
  const clean = v => String(v || '').trim()
    .replace(/[\u2013\u2014]/g, '-')
    .replace(/[\/\\:*?"<>|]/g, '')
    .replace(/\s+/g, '');
  const g = clean(document.getElementById('g').value);
  const d = clean(document.getElementById('d').value);
  const p = clean(document.getElementById('p').value);
  const parts = [g, d, p ? p + 'pers' : ''].filter(Boolean);
  return parts.length ? parts.join('_') : DEFAULT_TITLE;
}

function printWithName(){
  document.title = pdfFilename();
  window.print();
}
/* Restaure apres coup. afterprint n'est pas emis partout (Safari ancien) :
   le setTimeout sert de filet, il ne gene pas si l'evenement arrive. */
window.addEventListener('afterprint', () => { document.title = DEFAULT_TITLE; });
/* Cmd+P direct, sans passer par le bouton. */
window.addEventListener('beforeprint', () => { document.title = pdfFilename(); });

document.getElementById('print').addEventListener('click', () => {
  printWithName();
  setTimeout(() => { document.title = DEFAULT_TITLE; }, 3000);
});
render();
</script>
