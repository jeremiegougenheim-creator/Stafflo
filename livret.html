<style>
:root{
  --ink:#0F2318;
  --ink-soft:#2C4438;
  --cream:#FAF6EE;
  --paper:#FFFCF5;
  --gold:#C9963A;
  --terracotta:#B5533A;
  --rule:rgba(15,35,24,.14);
  --muted:#6B6760;
  --serif:'Noto Serif Display',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#E8E2D6;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ───────── Barre d'édition (écran seulement) ───────── */
.bar{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--cream);
     padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
     box-shadow:0 2px 20px rgba(15,35,24,.3)}
.bar h1{font-family:var(--serif);font-size:17px;font-weight:500;margin:0 18px 0 0;
        letter-spacing:.4px;align-self:center;white-space:nowrap}
.bar h1 span{color:var(--gold)}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(250,246,238,.55);font-weight:500}
.f input,.f select{font-family:var(--sans);font-size:13.5px;padding:7px 10px;border-radius:6px;
      border:1px solid rgba(250,246,238,.22);background:rgba(250,246,238,.08);color:var(--cream);min-width:130px}
.f input:focus,.f select:focus{outline:2px solid var(--gold);outline-offset:1px}
.f select option{background:var(--ink);color:var(--cream)}
.btn{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:8px 18px;border-radius:6px;
     border:1px solid var(--gold);background:var(--gold);color:var(--ink);cursor:pointer}
.btn:hover{background:#d9a749}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover{background:rgba(201,150,58,.14)}
.bar .spacer{flex:1}
.hint{width:100%;font-size:11.5px;color:rgba(250,246,238,.5);margin-top:2px}

/* ───────── Le livret ───────── */
.sheet{max-width:820px;margin:26px auto;background:var(--paper);padding:52px 60px 46px;
       box-shadow:0 8px 40px rgba(15,35,24,.16)}
.page+.page{margin-top:44px;padding-top:44px;border-top:1px dashed var(--rule)}

.cover{text-align:center;padding:18px 0 30px}
.eyebrow{font-family:var(--sans);font-size:10.5px;letter-spacing:4.5px;text-transform:uppercase;color:var(--muted)}
.cover .villa{font-family:var(--serif);font-size:50px;font-weight:400;margin:12px 0 8px;line-height:1.05}
.diamonds{color:var(--gold);letter-spacing:9px;font-size:12px;margin:6px 0 14px}
.cover .stay{font-family:var(--sans);font-size:12.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--ink-soft)}

.hello{font-family:var(--serif);font-size:22px;margin:26px 0 8px}
.lede{font-size:13.5px;line-height:1.7;color:var(--ink-soft);max-width:60ch}

.infobox{background:var(--cream);border-left:3px solid var(--gold);padding:16px 20px;margin:24px 0 8px}
.infobox div{font-size:12.5px;line-height:1.85}
.infobox .k{font-weight:700}

h2{font-family:var(--serif);font-size:22px;font-weight:500;margin:34px 0 6px;
   padding-bottom:7px;border-bottom:1px solid var(--rule)}
h2::before{content:"◆";color:var(--terracotta);font-size:13px;margin-right:9px;vertical-align:2px}
h3{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:2.6px;
   text-transform:uppercase;color:var(--terracotta);margin:22px 0 8px}

ul{margin:10px 0;padding-left:18px}
li{font-size:13px;line-height:1.62;margin-bottom:7px}
p{font-size:13px;line-height:1.7;margin:9px 0}
.en{font-style:italic;color:var(--muted);display:block;font-size:12.2px;line-height:1.55;margin-top:1px}

/* Chambres */
.room{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--rule)}
.room:last-child{border-bottom:none}
.rn{font-family:var(--serif);font-size:27px;color:var(--gold);line-height:1;width:34px;flex-shrink:0}
.rb{flex:1;min-width:0}
.rt{font-family:var(--serif);font-size:17px;margin-bottom:5px}
.rd{font-size:12.3px;line-height:1.65;color:var(--ink-soft)}
.rd b{font-family:var(--sans);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tag{display:inline-block;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;
     background:rgba(201,150,58,.16);color:#8a6520;padding:3px 8px;border-radius:3px;margin-bottom:6px}

/* Tableau repas */
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.3px}
th{font-family:var(--sans);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;
   text-align:left;padding:9px 8px;border-bottom:1.5px solid var(--ink);color:var(--ink)}
td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
td:first-child{font-weight:500}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}

.cols{column-count:2;column-gap:32px}
.cols li{break-inside:avoid}
.links li{break-inside:avoid;margin-bottom:10px}
a{color:var(--terracotta);text-decoration:none;border-bottom:1px solid rgba(181,83,58,.35)}
.sig{font-family:var(--serif);font-size:19px;margin-top:34px;text-align:right}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--rule);
      font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center}

/* ───────── Impression ───────── */
@page{size:A4;margin:14mm}
@media print{
  body{background:#fff}
  .bar,.hint{display:none !important}
  .sheet{max-width:none;margin:0;padding:0;box-shadow:none;background:#fff}
  .page{page-break-after:always}
  .page:last-child{page-break-after:auto}
  .page+.page{margin-top:0;padding-top:0;border-top:none}
  h2,h3{page-break-after:avoid}
  .room,tr,li{page-break-inside:avoid}
  a{color:var(--terracotta)}
}
@media (max-width:700px){
  .sheet{padding:28px 22px;margin:14px 8px}
  .cover .villa{font-size:36px}
  .cols{column-count:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

  {n:['La Perle aux Oiseaux','La Perle aux Oiseaux'], d:['5 min à pied — oiseaux exotiques, café sur place. 9h–18h. +212 6 61 63 35 11','5 min walk — exotic birds, café on site. 9 am–6 pm. +212 6 61 63 35 11']}
];

const RESTAURANTS = [
  {n:["L'Épicurien","L'Épicurien"], d:['Restaurant & lounge chic avec musique live, Hivernage.','Chic restaurant & lounge with live music, Hivernage.']},
  {n:['Le Comptoir Darna','Le Comptoir Darna'], d:['Spectacles de danse orientale, ambiance festive.','Oriental dance shows, festive atmosphere.']},
  {n:['Nomad','Nomad'], d:['Cuisine moderne, superbe vue sur les toits de la médina.','Modern dining, superb view over the medina roofs.']},
  {n:['La Mamounia','La Mamounia'], d:['Le palace de Marrakech — expérience gastronomique de luxe.','The Marrakech palace — a luxurious gastronomic experience.']},
  {n:['Le Foundouk','Le Foundouk'], d:['Restaurant élégant de la médina avec terrasse sur le toit.','Elegant medina restaurant with a rooftop terrace.']},
  {n:['Café de la Poste','Café de la Poste'], d:['Institution de Gueliz — terrasse, charme rétro-colonial.','Gueliz institution — terrace dining, retro-colonial charm.']}
];

const CAFES = [['Café des Épices'],['Terrasse des Épices'],['Café Arabe'],['Dar Cherifa']];

/* ═══ Rendu ═══ */
let LANG = 'bi';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapUrl = n => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(n + ' Marrakech');

/* t([fr,en]) — rend selon la langue ; en bilingue, l'anglais passe sous le français,
   et disparaît quand les deux textes sont identiques. */
function t(pair, tag){
  const fr = pair[0], en = pair[1] === undefined ? pair[0] : pair[1];
  if (LANG === 'fr') return esc(fr);
  if (LANG === 'en') return esc(en);
  if (fr === en) return esc(fr);
  return esc(fr) + '<span class="en">' + esc(en) + '</span>';
}
/* version courte pour les libellés inline (titres de tableau, etc.) */
function ti(pair){
  const fr = pair[0], en = pair[1] === undefined ? pair[0] : pair[1];
  if (LANG === 'fr') return esc(fr);
  if (LANG === 'en') return esc(en);
  return fr === en ? esc(fr) : esc(fr) + ' / ' + esc(en);
}
const listOf = arr => '<ul>' + arr.map(x => '<li>' + t(x) + '</li>').join('') + '</ul>';
const colsOf = arr => '<ul class="cols">' + arr.map(x => '<li>' + t(x) + '</li>').join('') + '</ul>';

function linksOf(arr){
  return '<ul class="links">' + arr.map(x =>
    '<li><b>' + ti(x.n) + '</b> — ' + t(x.d) +
    ' <a href="' + mapUrl(x.n[0]) + '" target="_blank" rel="noopener">' + ti(T.map) + '</a></li>'
  ).join('') + '</ul>';
}

function render(){
  const guest = document.getElementById('g').value.trim() || '—';
  const dates = document.getElementById('d').value.trim();
  const pax   = document.getElementById('p').value;
  LANG = document.getElementById('l').value;
  document.documentElement.lang = LANG === 'en' ? 'en' : 'fr';

  const stay = [dates, pax ? pax + ' ' + ti(T.guests) : ''].filter(Boolean).join(' · ');

  let h = '';

  /* ── Page 1 ── */
  h += '<div class="page"><div class="cover">' +
       '<div class="eyebrow">' + ti(T.welcome) + '</div>' +
       '<div class="villa">Villa Dar J</div>' +
       '<div class="diamonds">◆ ◆ ◆</div>' +
       '<div class="eyebrow">Marrakech</div>' +
       (stay ? '<div class="stay" style="margin-top:12px">' + esc(stay) + '</div>' : '') +
       '</div>';

  h += '<div class="hello">' + ti(T.hi) + ' ' + esc(guest) + ',</div>';
  h += '<div class="lede">' + t(T.lede) + '</div>';

  h += '<div class="infobox">' +
       '<div><span class="k">Wi-Fi</span> · ' + ti(T.net) + ' : ' + esc(VILLA.wifi.net) +
       ' · ' + ti(T.pass) + ' : ' + esc(VILLA.wifi.pass) + '</div>' +
       '<div>Said (WhatsApp / SMS) : ' + esc(VILLA.said) + '</div>' +
       '<div>Faiza (WhatsApp / SMS) : ' + esc(VILLA.faiza) + '</div>' +
       '<div>Villa Dar J — ' + esc(VILLA.address) +
       ' <a href="' + mapUrl('Villa Dar J ' + VILLA.address) + '" target="_blank" rel="noopener">' + ti(T.maps) + '</a></div>' +
       '</div>';

  h += '<h2>' + ti(T.practical) + '</h2>' + listOf(PRACTICAL) + '</div>';

  /* ── Page 2 : chambres ── */
  h += '<div class="page"><h2>' + ti(T.rooms) + '</h2>';
  h += '<p>' + t(T.roomsIntro) + '</p>';
  ROOMS.forEach((r, i) => {
    h += '<div class="room"><div class="rn">' + (i+1) + '</div><div class="rb">' +
         (r.tag ? '<div class="tag">' + ti(r.tag) + '</div>' : '') +
         '<div class="rt">' + ti(r.t) + '</div><div class="rd">' +
         '<b>' + ti(T.bed) + '</b> ' + ti(r.bed) + '<br>' +
         '<b>' + ti(T.bath) + '</b> ' + ti(r.bath) + '<br>' +
         t(r.d) + '</div></div></div>';
  });
  h += '<h3>' + ti(T.goodToKnow) + '</h3>' + listOf(GOOD_TO_KNOW) + '</div>';

  /* ── Page 3 : repas, loisirs, règles ── */
  h += '<div class="page"><h2>' + ti(T.meals) + '</h2>';
  h += '<p>' + t(T.mealsIntro) + '</p>';
  h += '<table><thead><tr><th>' + ti(T.thMeal) + '</th><th>' + ti(T.th16) + '</th><th>' +
       ti(T.th710) + '</th><th>' + ti(T.thHours) + '</th></tr></thead><tbody>';
  MEALS.forEach(m => {
    h += '<tr><td>' + ti(m.n) + '</td><td>' + ti(m.a) + '</td><td>' + ti(m.b) +
         '</td><td>' + ti(m.h) + '</td></tr>';
  });
  h += '</tbody></table><div class="note">' + t(T.mealNote) + '</div>';
  h += '<h2>' + ti(T.leisure) + '</h2>' + listOf(LEISURE);
  h += '<h2>' + ti(T.houseRules) + '</h2>' + listOf(RULES) + '</div>';

  /* ── Page 4 : menu ── */
  h += '<div class="page"><h2>' + ti(T.menu) + '</h2>';
  h += '<p>' + t(T.menuIntro) + '</p>';
  h += '<h3>' + ti(T.brk) + '</h3>' + listOf(BREAKFAST);
  h += '<h3>' + ti(T.starters) + '</h3>' + listOf(STARTERS);
  h += '<h3>' + ti(T.mains) + '</h3>' + colsOf(MAINS);
  h += '<h3>' + ti(T.desserts) + '</h3>' + colsOf(DESSERTS) + '</div>';

  /* ── Page 5 : Marrakech ── */
  h += '<div class="page"><h2>' + ti(T.discover) + '</h2>';
  h += '<h3>' + ti(T.medina) + '</h3>' + linksOf(MEDINA);
  h += '<h3>' + ti(T.ysl) + '</h3><p>' + t(T.yslTxt) +
       ' <a href="https://www.jardinmajorelle.com/" target="_blank" rel="noopener">' + ti(T.tickets) + '</a></p>';
  h += '<h3>' + ti(T.golf) + '</h3>' + linksOf(GOLF);
  h += '<h2>' + ti(T.activities) + '</h2>' + linksOf(ACTIVITIES);
  h += '<h2>' + ti(T.restaurants) + '</h2>' + linksOf(RESTAURANTS);
  h += '<h3>' + ti(T.cafes) + '</h3><ul class="links">' +
       CAFES.map(c => '<li><b>' + esc(c[0]) + '</b> <a href="' + mapUrl(c[0]) +
         '" target="_blank" rel="noopener">' + ti(T.map) + '</a></li>').join('') + '</ul>';
  h += '<div class="sig">' + t(T.bye) + '<br>' + esc(VILLA.host) + '</div>';
  h += '<div class="foot">Villa Dar J · Marrakech</div></div>';

  document.getElementById('sheet').innerHTML = h;
}

/* Pré-remplissage depuis l'URL — permet l'ouverture directe depuis une fiche
   client Stafflo : livret.html?guest=Sofia&dates=28%20JUL%20–%201%20AOU%2026&pax=12&lang=bi
   Chaque paramètre est optionnel ; absent, le champ garde sa valeur par défaut. */
(function prefillFromUrl(){
  const q = new URLSearchParams(location.search);
  const set = (id, key) => {
    const v = q.get(key);
    if (v !== null && v !== '') document.getElementById(id).value = v;
  };
  set('g','guest'); set('d','dates'); set('p','pax');
  const l = q.get('lang');
  if (l && ['fr','en','bi'].includes(l)) document.getElementById('l').value = l;
  /* ?print=1 ouvre directement la fenêtre d'impression, une fois le rendu fait. */
  if (q.get('print') === '1') setTimeout(() => window.print(), 600);
})();

['g','d','p','l'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));
document.getElementById('print').addEventListener('click', () => window.print());
render();
</script>
