<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livret d'accueil — Villa Dar J</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2318;
  --ink-soft:#2C4438;
  --cream:#FAF6EE;
  --paper:#FFFCF5;
  --gold:#C9963A;
  --terracotta:#B5533A;
  --rule:rgba(15,35,24,.14);
  --muted:#6B6760;
  --serif:'Noto Serif Display',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#E8E2D6;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ───────── Barre d'édition (écran seulement) ───────── */
.bar{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--cream);
     padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;
     box-shadow:0 2px 20px rgba(15,35,24,.3)}
.bar h1{font-family:var(--serif);font-size:17px;font-weight:500;margin:0 18px 0 0;
        letter-spacing:.4px;align-self:center;white-space:nowrap}
.bar h1 span{color:var(--gold)}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(250,246,238,.55);font-weight:500}
.f input,.f select{font-family:var(--sans);font-size:13.5px;padding:7px 10px;border-radius:6px;
      border:1px solid rgba(250,246,238,.22);background:rgba(250,246,238,.08);color:var(--cream);min-width:130px}
.f input:focus,.f select:focus{outline:2px solid var(--gold);outline-offset:1px}
.f select option{background:var(--ink);color:var(--cream)}
.btn{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:8px 18px;border-radius:6px;
     border:1px solid var(--gold);background:var(--gold);color:var(--ink);cursor:pointer}
.btn:hover{background:#d9a749}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover{background:rgba(201,150,58,.14)}
.bar .spacer{flex:1}
.hint{width:100%;font-size:11.5px;color:rgba(250,246,238,.5);margin-top:2px}

/* ───────── Le livret ───────── */
.sheet{max-width:820px;margin:26px auto;background:var(--paper);padding:52px 60px 46px;
       box-shadow:0 8px 40px rgba(15,35,24,.16)}
.page+.page{margin-top:28px;padding-top:28px;border-top:1px dashed var(--rule)}

.cover{text-align:center;padding:18px 0 30px}
.eyebrow{font-family:var(--sans);font-size:10.5px;letter-spacing:4.5px;text-transform:uppercase;color:var(--muted)}
.cover .villa{font-family:var(--serif);font-size:50px;font-weight:400;margin:12px 0 8px;line-height:1.05}
.diamonds{color:var(--gold);letter-spacing:9px;font-size:12px;margin:6px 0 14px}
.cover .stay{font-family:var(--sans);font-size:12.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--ink-soft)}

.hello{font-family:var(--serif);font-size:22px;margin:26px 0 8px}
.lede{font-size:13.5px;line-height:1.7;color:var(--ink-soft);max-width:60ch}

.infobox{background:var(--cream);border-left:3px solid var(--gold);padding:16px 20px;margin:24px 0 8px}
.infobox div{font-size:12.5px;line-height:1.85}
.infobox .k{font-weight:700}

h2{font-family:var(--serif);font-size:22px;font-weight:500;margin:28px 0 6px;
   padding-bottom:7px;border-bottom:1px solid var(--rule)}
h2::before{content:"◆";color:var(--terracotta);font-size:13px;margin-right:9px;vertical-align:2px}
h3{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:2.6px;
   text-transform:uppercase;color:var(--terracotta);margin:12px 0 5px}

ul{margin:9px 0;padding-left:18px}
li{font-size:13px;line-height:1.55;margin-bottom:5px}
p{font-size:13px;line-height:1.6;margin:8px 0}
.en{font-style:italic;color:var(--muted);display:block;font-size:12.2px;line-height:1.5;margin-top:0}

/* Chambres */
.room{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--rule)}
.room:last-child{border-bottom:none}
.rn{font-family:var(--serif);font-size:27px;color:var(--gold);line-height:1;width:34px;flex-shrink:0}
.rb{flex:1;min-width:0}
.rt{font-family:var(--serif);font-size:17px;margin-bottom:5px}
.rd{font-size:12.3px;line-height:1.65;color:var(--ink-soft)}
.rd b{font-family:var(--sans);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tag{display:inline-block;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;
     background:rgba(201,150,58,.16);color:#8a6520;padding:3px 8px;border-radius:3px;margin-bottom:6px}

/* Tableau repas */
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.3px}
th{font-family:var(--sans);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;
   text-align:left;padding:9px 8px;border-bottom:1.5px solid var(--ink);color:var(--ink)}
td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
td:first-child{font-weight:500}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
/* Le contact de l'hote est un recours, pas une alternative : plus petit,
   en gris, detache par un filet. On le trouve si on le cherche, on ne
   tombe pas dessus en lisant le bloc contacts. */
.host-fallback{font-size:11px;color:var(--muted);margin-top:8px;padding-top:7px;
               border-top:1px solid var(--rule);line-height:1.5}
.callout{background:var(--cream);border-left:3px solid var(--gold);padding:10px 14px;margin:10px 0 4px;
         font-size:12px;line-height:1.55;color:var(--ink-soft)}

.cols{column-count:2;column-gap:32px}
.cols li{break-inside:avoid}
.links li{break-inside:avoid;margin-bottom:10px}
a{color:var(--terracotta);text-decoration:none;border-bottom:1px solid rgba(181,83,58,.35)}
.sig{font-family:var(--serif);font-size:19px;margin-top:34px;text-align:right}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--rule);
      font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-align:center}

/* ───────── Impression ───────── */
@page{size:A4;margin:25.4mm}
@media print{
  body{background:#fff}
  .bar,.hint{display:none !important}
  .sheet{max-width:none;margin:0;padding:0;box-shadow:none;background:#fff}
  /* Le document coule. page-break-after:always forcait une feuille par
     section : les Regles de la maison (5 puces) consommaient une page
     entiere, et la derniere n'avait que trois lignes. C'etait la cause du
     blanc, pas les interlignes. Les sections sont marquees par leurs titres
     et leurs filets, pas par du papier. */
  .page{page-break-after:auto}
  .page+.page{margin-top:14px;padding-top:0;border-top:none}
  /* On empeche seulement les coupures laides : un titre seul en bas de page,
     une ligne orpheline, un bloc chambre ou une ligne de tableau scindee. */
  h2,h3{page-break-after:avoid;break-after:avoid}
  .room,tr,li{page-break-inside:avoid}
  p,li{orphans:2;widows:2}
  a{color:var(--terracotta)}

  /* ── Densite d'impression ──────────────────────────────────────────────
     Les espacements ci-dessus sont regles pour l'ecran, ou il faut respirer :
     34px au-dessus de chaque h2, 22px au-dessus de chaque h3, 7px sous chaque
     puce. Applique tel quel au papier, cela gonfle le document sans rien
     apporter. On resserre ici, et ici seulement — la lecture a l'ecran reste
     inchangee. */
  h2{margin:22px 0 5px;font-size:20px;padding-bottom:4px}
  h3{margin:9px 0 4px}
  p{margin:7px 0;line-height:1.48}
  ul{margin:8px 0}
  li{margin-bottom:4px;line-height:1.42}
  .en{line-height:1.4;font-size:11.8px}
  .lede{line-height:1.5}
  .cover{padding:10px 0 18px}
  .cover .villa{font-size:42px;margin:8px 0 6px}
  .hello{margin:18px 0 6px}
  .infobox{margin:16px 0 6px;padding:12px 16px}
  .infobox div{line-height:1.6}
  .room{padding:9px 0}
  table{margin:10px 0}
  th,td{padding:6px 8px}
  .links li{margin-bottom:5px}
  .sig{margin-top:22px}
  .foot{margin-top:18px;padding-top:9px}
}
@media (max-width:700px){
  .sheet{padding:28px 22px;margin:14px 8px}
  .cover .villa{font-size:36px}
  .cols{column-count:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* t([fr,en]) — rend selon la langue ; en bilingue, l'anglais passe sous le français,
   et disparaît quand les deux textes sont identiques. */
/* Un saut de ligne litteral dans les donnees devient un <br> a l'affichage.
   Les textes passent par esc(), on ne peut donc pas y ecrire la balise
   directement : la conversion se fait apres echappement. Cela permet d'aerer
   les blocs de trois ou quatre phrases sans toucher a leur contenu. */
const br = txt => esc(txt).replace(/\n/g, '<br>');
function t(pair, tag){
  const fr = pair[0], en = pair[1] === undefined ? pair[0] : pair[1];
  if (LANG === 'fr') return br(fr);
  if (LANG === 'en') return br(en);
  if (fr === en) return br(fr);
  return br(fr) + '<span class="en">' + br(en) + '</span>';
}
/* version courte pour les libellés inline (titres de tableau, etc.) */
function ti(pair){
  const fr = pair[0], en = pair[1] === undefined ? pair[0] : pair[1];
  if (LANG === 'fr') return esc(fr);
  if (LANG === 'en') return esc(en);
  return fr === en ? esc(fr) : esc(fr) + ' / ' + esc(en);
}
const listOf = arr => '<ul>' + arr.map(x => '<li>' + t(x) + '</li>').join('') + '</ul>';

/* Lignes "etiquette : valeur" — Menage, Blanchisserie, Deplacements...
   L'etiquette passe en gras pour qu'on la repere en balayant la page au lieu
   de lire chaque ligne. Le gras est applique APRES echappement : t() passe le
   texte dans esc(), on ne peut donc pas injecter la balise avant.
   En bilingue, seule la ligne francaise est mise en gras : la traduction est
   deja distinguee par son italique, la doubler alourdirait. */
/* Met en valeur ce qu'on cherche en parcourant une ligne : un prix, une
   heure, un delai. Volontairement restreint — si tout est en gras, plus rien
   ne l'est. Applique APRES l'etiquette pour ne jamais imbriquer deux balises. */
const EMPH = [
  /(\d{1,4}\s?MAD)/g,                       // 400 MAD
  /(\d{1,2}h(?:\d{2})?)/g,                   // 9h00, 16h, 10h30
  /(\d{1,2}(?::\d{2})?\s?(?:am|pm))/gi,      // 9:00 am, 4 pm
  /(\d{1,2}\s?h\b)/g,                        // 48 h
  /(\b(?:la veille|the day before)\b)/gi,
  /(\b(?:2 jours à l'avance|2 days ahead)\b)/gi,
  /(\b(?:chaque jour|every day)\b)/gi,
  /(\b(?:une fois par semaine|once a week)\b)/gi,
  /(\b10 (?:personnes|people)\b)/gi,
  /(une entrée, un plat et un dessert|one starter, one main and one dessert)/gi,
  /(toute allergie ou restriction alimentaire|any allergies or dietary restrictions)/gi,
  /((?:deux|two) nourrissons en berceau|two infants in cots)/gi
];
function emph(txt){
  let out = txt;
  EMPH.forEach(re => { out = out.replace(re, '<strong>$1</strong>'); });
  /* garde-fou : jamais deux <strong> imbriques */
  return out.replace(/<strong>([^<]*)<strong>/g, '<strong>$1').replace(/<\/strong><\/strong>/g, '</strong>');
}
function labelled(escaped){
  const m = escaped.match(/^([^:]{2,40}\s*:)/);
  return m ? '<strong>' + m[1] + '</strong>' + emph(escaped.slice(m[1].length))
           : emph(escaped);
}
function tLabelled(pair){
  const fr = pair[0], en = pair[1] === undefined ? pair[0] : pair[1];
  if (LANG === 'fr') return labelled(br(fr));
  if (LANG === 'en') return labelled(br(en));
  if (fr === en)     return labelled(br(fr));
  return labelled(br(fr)) + '<span class="en">' + br(en) + '</span>';
}
const listOfLabelled = arr => '<ul>' + arr.map(x => '<li>' + tLabelled(x) + '</li>').join('') + '</ul>';
const colsOf = arr => '<ul class="cols">' + arr.map(x => '<li>' + t(x) + '</li>').join('') + '</ul>';

function linksOf(arr){

/* Pré-remplissage depuis l'URL — permet l'ouverture directe depuis une fiche
   client Stafflo : livret.html?guest=Sofia&dates=28%20JUL%20–%201%20AOU%2026&pax=12&lang=bi
   Chaque paramètre est optionnel ; absent, le champ garde sa valeur par défaut. */
(function prefillFromUrl(){
  const q = new URLSearchParams(location.search);
  const set = (id, key) => {
    const v = q.get(key);
    if (v !== null && v !== '') document.getElementById(id).value = v;
  };
  set('g','guest'); set('d','dates'); set('p','pax');
  const l = q.get('lang');
  if (l && ['fr','en','bi'].includes(l)) document.getElementById('l').value = l;
  /* ?print=1 ouvre directement la fenêtre d'impression, une fois le rendu fait. */
  if (q.get('print') === '1') setTimeout(() => {
    if (typeof printWithName === 'function') printWithName(); else window.print();
  }, 600);
})();

['g','d','p','l'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));

/* Nom du PDF — les navigateurs reprennent document.title comme nom de fichier
   par defaut a l'impression. On le remplace juste avant d'imprimer, puis on le
   restaure : l'onglet garde son titre normal le reste du temps.
   Forme : Prenom_29SEP-2OCT26_10pers
   Les caracteres interdits dans un nom de fichier (/ \ : * ? " < > |) sont
   retires, les tirets longs ramenes a un tiret simple, les espaces supprimes
   — sinon Chrome et Safari les remplacent chacun a leur maniere. */
const DEFAULT_TITLE = document.title;

function pdfFilename(){
  const clean = v => String(v || '').trim()
    .replace(/[\u2013\u2014]/g, '-')
    .replace(/[\/\\:*?"<>|]/g, '')
    .replace(/\s+/g, '');
  const g = clean(document.getElementById('g').value);
  const d = clean(document.getElementById('d').value);
  const p = clean(document.getElementById('p').value);
  const parts = [g, d, p ? p + 'pers' : ''].filter(Boolean);
  return parts.length ? parts.join('_') : DEFAULT_TITLE;
}

function printWithName(){
  document.title = pdfFilename();
  window.print();
}
/* Restaure apres coup. afterprint n'est pas emis partout (Safari ancien) :
   le setTimeout sert de filet, il ne gene pas si l'evenement arrive. */
window.addEventListener('afterprint', () => { document.title = DEFAULT_TITLE; });
/* Cmd+P direct, sans passer par le bouton. */
window.addEventListener('beforeprint', () => { document.title = pdfFilename(); });

document.getElementById('print').addEventListener('click', () => {
  printWithName();
  setTimeout(() => { document.title = DEFAULT_TITLE; }, 3000);
});
render();
