<!--
  Vue équipe Stafflo — pour Saïd, Bouchra, la cuisinière. Sans compte : lien
  personnel equipe.html#k=… créé dans l'Espace (Maison › Accès équipe).
  Données servies par la fonction staff-view : prénom + initiale, dates,
  composition, heure d'arrivée, couchages, repas, consigne. Jamais de prix,
  de téléphone, d'email ni les notes du propriétaire. Lecture seule.
  Aucun fait de la villa écrit ici (CLAUDE.md §13).
-->
<style>
:root{color-scheme:light;
  --paper:#F4EFE3;--card:#FFFDF8;--gd:#0F2318;--gm:#1D4D3A;--gold:#C9963A;--gold-ink:#8E6414;
  --ink:#1A1208;--muted:#655F52;--line:rgba(26,18,8,.10);
  --go-bg:#E3F0E8;--go:#1F6B47;--wait-bg:#FDF0D6;--wait:#8A5D0F;--house-bg:#E6EEF6;--house:#2C5875;--alert-bg:#FAE8E2;--alert:#9B3A25}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 Inter,"SF Arabic","Geeza Pro","Noto Sans Arabic",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
html[dir=rtl] body{font-size:17px}
.top{background:linear-gradient(158deg,#182821,#13201A 60%,#0E1B15);color:#F4EFE3;padding:calc(18px + env(safe-area-inset-top)) 16px 18px;border-bottom:2px solid var(--gold)}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:flex-start;gap:12px}
.top .tx{flex:1;min-width:0}
.kick{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
html[dir=rtl] .kick{letter-spacing:0}
h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:30px;line-height:1.15;margin:2px 0 4px}
html[dir=rtl] h1{font-family:inherit;font-weight:700;font-size:25px}
.date{font-size:15px;color:#D9D2C1}
.lang{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid rgba(201,150,58,.6);background:transparent;color:#F4EFE3;font:600 14px/1 inherit;font-family:inherit;cursor:pointer}
/* 22/10 : trois langues — le bouton devient un sélecteur FR · EN · عربية */
#langBtn{display:flex;padding:3px;gap:2px;cursor:default}
#langBtn .lb{min-height:36px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:#F4EFE3;font:600 13px/1 inherit;font-family:inherit;cursor:pointer}
#langBtn .lb[aria-pressed="true"]{background:#C9963A;color:#0F2318}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.band{display:flex;gap:8px;align-items:center;font-size:14px;padding:10px 12px;border-radius:12px;margin:0 0 12px;background:var(--wait-bg);color:var(--wait)}
.band.err{background:var(--alert-bg);color:var(--alert)}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gm);margin:20px 4px 8px;font-weight:700;display:flex;gap:8px;align-items:baseline}
html[dir=rtl] h2{letter-spacing:0;font-size:16px}
h2 small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 10px;box-shadow:0 1px 2px rgba(26,18,8,.04)}
.card.go{border-inline-start:4px solid var(--go)}.card.alert{border-inline-start:4px solid var(--alert)}.card.house{border-inline-start:4px solid var(--house)}.card.wait{border-inline-start:4px solid var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--wait-bg);color:var(--wait)}
.chip.go{background:var(--go-bg);color:var(--go)}.chip.alert{background:var(--alert-bg);color:var(--alert)}.chip.house{background:var(--house-bg);color:var(--house)}
.name{font-size:21px;font-weight:700;margin:0 0 2px}
.dates{font-size:15px;color:var(--muted);margin:0 0 10px}
.dates b{color:var(--ink);font-weight:600;white-space:nowrap}.dates .nw{white-space:nowrap}
.pax{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px}
.pax div{background:var(--paper);border-radius:12px;padding:8px 6px;text-align:center}
.pax b{display:block;font-size:22px;line-height:1.1}
.pax span{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15.5px}
.row i{font-size:20px;color:var(--gold-ink);flex:none;margin-top:1px}
.row .k{font-size:12.5px;color:var(--muted);display:block}
.row .v{white-space:pre-line;overflow-wrap:anywhere}
.row .v.q{color:var(--wait);font-weight:700}
.row ul.v{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.row ul.v li{padding-inline-start:14px;position:relative}
.row ul.v li::before{content:'•';position:absolute;inset-inline-start:0;color:var(--gold-ink)}
.row details.orig{margin-top:4px;font-size:13.5px;color:var(--muted)}
.row details.orig summary{cursor:pointer;list-style:none;display:inline-block;padding:2px 0}
.row details.orig summary::-webkit-details-marker{display:none}
.row details.orig ul{margin-top:4px}
.empty{color:var(--muted);font-size:15px;margin:4px 4px 0}
.foot{margin:22px 4px 0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:stretch}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:600 16px/1 inherit;font-family:inherit;color:var(--gm);display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer}
.btn:disabled{opacity:.55}

.ready{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.btn.ready-btn{width:100%;background:var(--gd);color:#F4EFE3;border-color:var(--gd)}
.ready .done{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--go);font-size:15.5px}
.ready .done i{font-size:20px}
.issue{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:14px 0 10px}
.issue h3{margin:0 0 6px;font-size:16px}
.issue p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.issue textarea{width:100%;box-sizing:border-box;min-height:84px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15.5px;background:var(--paper);color:var(--ink);resize:vertical}
.issue .btn{margin-top:8px;width:100%}
.issue .st{margin:8px 0 0;font-weight:700;font-size:14px;color:var(--go)}.issue .st.err{color:var(--alert)}
.sk{height:120px;border-radius:18px;background:linear-gradient(90deg,#EFE8D8,#F7F2E7,#EFE8D8);background-size:200% 100%;animation:sk 1.2s linear infinite;margin:0 0 10px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>

          S.data = x.d; S.state = 'ok';
          store.set(C_KEY, JSON.stringify(x.d));
          if (!store.get(L_KEY) && isLang(x.d.lang)) S.lang = x.d.lang;
          // 20/10 : le serveur traduit ce qui manque en arrière-plan (`pending`) → on relit quelques secondes après, 6 fois au plus.
          clearTimeout(S.poll);
          if (x.d.pending > 0 && x.d.tr === S.lang && S.tries < 6) { S.tries++; S.poll = setTimeout(load, 5000); } else S.tries = 0;
        } else if (x.status === 404) {
          S.data = null; S.state = 'invalid'; store.set(C_KEY, null);
        } else { S.state = S.data ? 'server' : 'server-empty'; }
      })
      .catch(function () { S.state = S.data ? 'offline' : 'offline-empty'; })
      .then(function () { S.busy = false; render(); });
  }

  /* Retour vers le propriétaire (staff_reports) : « chambres prêtes » pour un séjour, ou un problème. */
  function report(kind, clientId, text) {
    if (!S.k) return Promise.reject(new Error('no_link'));
    return fetch(FN, { method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
      body: JSON.stringify({ k: S.k, action: 'report', kind: kind, client_id: clientId || null, text: text || null }) })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http_' + r.status)); })
      .then(function (d) {
        if (!d || !d.report) throw new Error('bad');
        S.data = S.data || {}; S.data.reports = [d.report].concat(S.data.reports || []);
        store.set(C_KEY, JSON.stringify(S.data));
        return d.report;
      });
  }
  function reportOf(kind, stayId) {
    return ((S.data && S.data.reports) || []).filter(function (r) { return r.kind === kind && String(r.client_id) === String(stayId); })[0] || null;
  }
  function readyReport(stayId) { return reportOf('rooms_ready', stayId); }
  function isKitchen() { return !!(S.data && S.data.role === 'kitchen'); }
  function fmtClock(isoTs) { var d = new Date(isoTs); return isNaN(d) ? '' : d.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' }); }

  function stayCard(s, t, tone, chips) {
    var l = L(), a = dayNum(s.a), d = dayNum(s.d), h = '';
    h += '<article class="card ' + tone + '">';
    if (chips.length) h += '<div class="chips">' + chips.map(function (c) { return '<span class="chip ' + c[0] + '">' + esc(c[1]) + '</span>'; }).join('') + '</div>';
    h += '<p class="name"><bdi>' + esc(s.name) + '</bdi></p>';
    h += '<p class="dates">' + esc(l.arrival) + ' <b>' + esc(fmt(a)) + '</b> ' + l.arrow + ' ' + esc(l.departure) + ' <b>' + esc(fmt(d)) + '</b> <span class="nw">· ' + esc(l.nights(s.nights)) + '</span></p>';
    var cells = [], K = isKitchen();
    // Prestataire : les couverts d'abord (adultes + enfants), le détail seulement s'il y a des enfants ou des bébés.
    if (K && s.pax != null) cells.push([s.pax, l.covers]);
    if (!K && s.adults != null) cells.push([s.adults, l.adults]);
    if (s.children) cells.push([s.children, l.children]);
    if (s.infants) cells.push([s.infants, l.infants]);
    if (!cells.length) cells.push([s.pax != null ? s.pax : l.unknown, K ? l.covers : l.people]);
    h += '<div class="pax">' + cells.map(function (c) { return '<div><b>' + esc(c[0]) + '</b><span>' + esc(c[1]) + '</span></div>'; }).join('') + '</div>';
    /* Lisible (18/10) : une ligne par phrase ou par article (`lines`, calculées par le serveur ; ancienne réponse en cache → le texte tel quel).
       Une seule langue (20/10) : les mêmes lignes traduites dans la langue de la page — `ar` (tout, en darija) ou `fr` (ce que le
       client a écrit dans une autre langue) ; Mistral UE, gardées en base ; le texte d'origine reste un geste plus bas. */
    var list = function (arr, dir) { return arr.length === 1 ? '<span class="v" dir="' + dir + '">' + esc(arr[0]) + '</span>' : '<ul class="v" dir="' + dir + '">' + arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'; };
    var row = function (icon, k, v, none, f) {
      var fr = s.lines && f && Array.isArray(s.lines[f]) ? s.lines[f] : (String(v || '').trim() ? [String(v).trim()] : []);
      var tl = s[S.lang] && f && Array.isArray(s[S.lang][f]) && s[S.lang][f].length === fr.length ? s[S.lang][f] : null;
      var changed = tl && tl.some(function (x, i) { return x !== fr[i]; });
      var body = !fr.length ? '<span class="v q" dir="auto">' + esc(none || l.unknown) + '</span>'
        : tl ? list(tl, S.lang === 'ar' ? 'rtl' : 'auto') + (changed && /^(meals|drinks|note|extras|beds)$/.test(f) ? '<details class="orig"><summary>' + esc(l.orig) + '</summary>' + list(fr, 'auto') + '</details>' : '') // l'original replié sous les textes libres seulement (pas sous une heure)
        : list(fr, 'auto');
      return '<div class="row"><i class="ti ti-' + icon + '" aria-hidden="true"></i><div>' + '<span class="k">' + esc(k) + '</span>' + body + '</div></div>';
    };
    // Qui part aujourd'hui : plus besoin d'heure, de lits ni de repas.
    var hasOrders = String(s.orders || '').trim() !== '', hasHouse = String(s.house_orders || '').trim() !== '';
    if (a >= t) h += row('clock', l.time, s.arrival_time, null, 'arrival_time');
    if (!K && a >= t) h += row('bed', l.beds, s.beds, null, 'beds');
    // Commande du livret (20/10) : au prestataire ses repas, jour par jour ; à chacun ce que la maison prépare.
    if (K && d > t && hasOrders) h += row('tools-kitchen-2', l.orders, s.orders, null, 'orders');
    if (d > t && String(s.menus || '').trim()) h += row('chef-hat', l.menus, s.menus, null, 'menus'); // 23/10 : un menu par repas (entrée · plat · dessert)
    // 24/10 (cas réel : vue de Fatima, Seán) : « Repas · Pas encore reçus » sous des repas commandés et des menus. Le texte du client
    // était entièrement repris ailleurs (jours → commande, plats → menus, goûter → maison) : plus rien à montrer, pas « rien reçu ».
    var mealLines = s.lines && Array.isArray(s.lines.meals) ? s.lines.meals : (String(s.meals || '').trim() ? [String(s.meals).trim()] : []);
    var mealsElsewhere = hasOrders || String(s.menus || '').trim() !== '' || (!K && hasHouse);
    if (d > t && (mealLines.length || !mealsElsewhere)) h += row('tools-kitchen-2', l.meals, s.meals, l.mealsNone, 'meals');
    // 24/10 : la vue prestataire ne montre plus ce que prépare la maison (goûter, déjeuner léger) — le prestataire n'en a pas besoin
    if (d > t && hasHouse && !K) h += row('home', K ? l.houseOrdersK : l.houseOrders, s.house_orders, null, 'house_orders');
    if (!K && d > t && String(s.drinks || '').trim()) h += row('glass', l.drinks, s.drinks, null, 'drinks');
    if (!K && d > t && String(s.extras || '').trim()) h += row('shopping-bag', l.extras, s.extras, null, 'extras');
    // Heure de départ (17/10/2026) : seulement si elle est connue — utile le jour du départ et pour l'interlocation.
    if (d >= t && String(s.departure_time || '').trim()) h += row('door-exit', l.depTime, s.departure_time, null, 'departure_time');
    // Interlocation (20/10) : la prochaine arrivée après ce départ — la date dans la langue de la page, l'heure traduite comme le reste.
    if (d >= t && s.next && s.next.d) {
      var nt = s[S.lang] && Array.isArray(s[S.lang].next_time) && s[S.lang].next_time.length ? s[S.lang].next_time[0] : String(s.next_time || '').trim();
      h += '<div class="row"><i class="ti ti-refresh" aria-hidden="true"></i><div><span class="k">' + esc(l.nextArr) + '</span><span class="v" dir="auto">' + esc(fmt(dayNum(s.next.d)) + (s.next.same_day ? ' · ' + l.sameDayShort : '') + (nt ? ' · ' + nt : '')) + '</span></div></div>';
    }
    if (String(s.note || '').trim()) h += row('note', l.note, s.note, null, 'note');
    // « Chambres prêtes » (maison, arrivée du jour ou à venir) ou « Repas confirmés » (prestataire, séjour pas fini, quelque chose à préparer) ;
    // une fois envoyé, l'heure reste affichée.
    if (s.id && (K ? d > t && (hasOrders || hasHouse || String(s.meals || '').trim()) : a >= t)) {
      var kind = K ? 'meals_ok' : 'rooms_ready', rr = reportOf(kind, s.id);
      h += '<div class="ready">' + (rr
        ? '<span class="done"><i class="ti ti-circle-check" aria-hidden="true"></i>' + esc((K ? l.mealsDone : l.roomsDone) + fmtClock(rr.created_at)) + '</span>'
        : '<button type="button" class="btn ready-btn" data-a="ready" data-kind="' + kind + '" data-id="' + esc(s.id) + '"' + (S.busy ? ' disabled' : '') + '><i class="ti ti-' + (K ? 'chef-hat' : 'bed') + '" aria-hidden="true"></i>' + esc(K ? l.mealsOk : l.roomsReady) + '</button>') + '</div>';
    }
    return h + '</article>';
  }

  function render() {
    var l = L(), app = document.getElementById('app');
    document.documentElement.lang = isLang(S.lang) ? S.lang : 'fr';
    document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
    document.title = l.title + ' · Stafflo';
    document.getElementById('title').textContent = l.title;
    var who = S.data && S.data.name ? l.hello + ' ' + S.data.name + (isKitchen() ? ' · ' + l.kitchenTag : '') + ' · ' : '';
    document.getElementById('hello').textContent = who + fmt(todayNum(), true);
    // Sélecteur FR · EN · عربية (22/10) : trois boutons, celui de la page enfoncé ; l'ancien bouton « autre langue » devient ce sélecteur.
    document.getElementById('langBtn').innerHTML = LANGS.map(function (x) { return '<button type="button" class="lb" data-l="' + x + '" lang="' + x + '" aria-pressed="' + (S.lang === x) + '">' + (x === 'ar' ? 'عربية' : x.toUpperCase()) + '</button>'; }).join('');

    if (!S.k) { app.innerHTML = '<div class="band err" role="alert"><i class="ti ti-link-off" aria-hidden="true"></i>' + esc(l.noLink) + '</div>'; return; }
    if (S.state === 'invalid') { app.innerHTML = '<div class="band err" role="alert"><i class="ti ti-link-off" aria-hidden="true"></i>' + esc(l.invalid) + '</div>'; return; }
    if (!S.data) {
      app.innerHTML = (S.state === 'offline-empty' || S.state === 'server-empty'
        ? '<div class="band err" role="alert">' + esc(S.state === 'offline-empty' ? l.offline.replace(/ — .*$/, '') : l.server.replace(/ — .*$/, '')) + '</div><button type="button" class="btn" data-a="refresh"><i class="ti ti-refresh" aria-hidden="true"></i>' + esc(l.refresh) + '</button>'
        : '<p class="empty">' + esc(l.loading) + '</p><div class="sk"></div><div class="sk"></div>');
      return;
    }
    var t = todayNum(), stays = S.data.stays || [], h = '';
    if (S.state === 'offline' || S.state === 'server') h += '<div class="band"><i class="ti ti-wifi-off" aria-hidden="true"></i>' + esc((S.state === 'offline' ? l.offline : l.server) + fmtTime(S.data.at)) + '</div>';
    else if (S.data.pending > 0 && S.data.tr === S.lang && S.tries > 0) h += '<div class="band"><i class="ti ti-language" aria-hidden="true"></i>' + esc(l.trBusy) + '</div>';
    var nowList = stays.filter(function (s) { var a = dayNum(s.a), d = dayNum(s.d); return a <= t && t <= d; });
    var nextList = stays.filter(function (s) { return dayNum(s.a) > t; });
    h += '<h2>' + esc(l.today) + '</h2>';
    h += nowList.length ? nowList.map(function (s) {
      var a = dayNum(s.a), d = dayNum(s.d), chips = [], tone = 'house';
      if (d === t) { chips.push(['alert', l.leaveToday]); tone = 'alert'; }
      if (a === t) { chips.push(['go', l.arriveToday]); tone = 'go'; }
      if (a < t && t < d) chips.push(['house', l.dayOf(t - a + 1, s.nights)]);
      return stayCard(s, t, tone, chips);
    }).join('') : '<p class="empty">' + esc(l.nobody) + '</p>';
    h += '<h2>' + esc(l.next) + ' <small>' + esc(l.nextSub) + '</small></h2>';
    h += nextList.length ? nextList.map(function (s) {
      var chips = [['wait', l.inDays(dayNum(s.a) - t)]];
      if (s.same_day) chips.push(['alert', l.sameDay]);
      return stayCard(s, t, 'wait', chips);
    }).join('') : '<p class="empty">' + esc(l.noNext) + '</p>';
    h += '<form class="issue" id="issue"><h3>' + esc(l.issueTitle) + '</h3><p>' + esc(l.issueHelp) + '</p>' +
      '<textarea id="issueTxt" maxlength="300" placeholder="' + esc(l.issuePh) + '" dir="auto"></textarea>' +
      '<button type="submit" class="btn"><i class="ti ti-alert-triangle" aria-hidden="true"></i>' + esc(l.send) + '</button><div id="issueSt"></div></form>';
    h += '<div class="foot"><button type="button" class="btn" data-a="refresh"' + (S.busy ? ' disabled' : '') + '><i class="ti ti-refresh" aria-hidden="true"></i>' + esc(S.busy ? l.loading : l.refresh) + '</button>' +
      '<span>' + esc(l.updated + fmtTime(S.data.at)) + '</span><span>' + esc(l.personal) + '</span></div>';
    app.innerHTML = h;
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a="refresh"]');
    if (b) { load(); return; }
    var rb = e.target.closest('[data-a="ready"]');
    if (rb) {
      rb.disabled = true;
      report(rb.getAttribute('data-kind') === 'meals_ok' ? 'meals_ok' : 'rooms_ready', rb.getAttribute('data-id')).then(function () { render(); }, function () { rb.disabled = false; alertBand(L().sendErr); });
      return;
    }
    var lb = e.target.closest('#langBtn .lb');
    if (lb) { var nl = lb.getAttribute('data-l'); if (isLang(nl) && nl !== S.lang) { S.lang = nl; store.set(L_KEY, S.lang); S.tries = 0; render(); if (S.data && S.data.tr !== S.lang) load(); } } // une autre langue : ses traductions viennent du serveur
  });
  function alertBand(msg) {
    var app = document.getElementById('app'), b = document.createElement('div');
    b.className = 'band err'; b.setAttribute('role', 'alert'); b.textContent = msg;
    app.insertBefore(b, app.firstChild); setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 4000);
  }
  document.addEventListener('submit', function (e) {
    if (!e.target || e.target.id !== 'issue') return;
    e.preventDefault();
    var l = L(), ta = document.getElementById('issueTxt'), st = document.getElementById('issueSt'), btn = e.target.querySelector('button[type="submit"]');
    var text = (ta.value || '').trim(); if (!text) { ta.focus(); return; }
    btn.disabled = true; btn.textContent = l.sending; st.innerHTML = '';
    report('issue', null, text).then(function () { ta.value = ''; st.innerHTML = '<p class="st">' + esc(l.sent) + '</p>'; }, function () { st.innerHTML = '<p class="st err">' + esc(l.sendErr) + '</p>'; })
      .then(function () { btn.disabled = false; btn.innerHTML = '<i class="ti ti-alert-triangle" aria-hidden="true"></i>' + esc(l.send); });
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && Date.now() - S.lastTry > 5 * 60000) load(); });
  window.addEventListener('hashchange', function () { S.k = readToken(); load(); });
  setInterval(function () { if (document.visibilityState === 'visible') load(); }, 10 * 60000);

  S.k = readToken();
  S.lang = store.get(L_KEY);
  try { var c = JSON.parse(store.get(C_KEY) || 'null'); if (c && Array.isArray(c.stays)) { S.data = c; S.state = 'ok'; if (!S.lang) S.lang = c.lang; } } catch (e) {}
  if (!isLang(S.lang)) S.lang = /^ar\b/i.test(navigator.language || '') ? 'ar' : /^en\b/i.test(navigator.language || '') ? 'en' : 'fr';
  render();
  load();
})();
</script>
</body>
</html>
