<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stafflo — Connexion</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#2d5a3a,#1f4330);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:#fff;padding:2.5rem;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:400px;}
h1{color:#2d5a3a;margin-bottom:0.5rem;font-size:1.8rem;}
p.sub{color:#64748b;margin-bottom:2rem;font-size:0.95rem;}
input{width:100%;padding:0.85rem 1rem;border:1.5px solid #e2e8f0;border-radius:8px;font-size:1rem;margin-bottom:1rem;transition:border 0.2s;}
input:focus{outline:none;border-color:#2d5a3a;}
button.btn{width:100%;padding:0.9rem;background:#2d5a3a;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background 0.2s;}
button.btn:hover{background:#1f4330;}
button.btn:disabled{background:#94a3b8;cursor:not-allowed;}
.err{color:#dc2626;font-size:0.9rem;margin-top:0.25rem;min-height:1.2rem;}
.ok{color:#10b981;font-size:0.9rem;margin-top:0.25rem;min-height:1.2rem;}
.toggle{text-align:center;margin-top:1.5rem;color:#64748b;font-size:0.9rem;}
.toggle a{color:#2d5a3a;cursor:pointer;font-weight:500;}
#loader{display:none;text-align:center;padding:0.75rem;color:#64748b;font-size:0.9rem;}
</style>
</head>
<body>
<div class="card">
  <h1>🏡 Stafflo</h1>
  <p class="sub" id="subtitle">Connectez-vous à votre dashboard villa</p>

  <!-- LOGIN -->
  <div id="view-login">
    <input type="email" id="l-email" placeholder="Email" autocomplete="email">
    <input type="password" id="l-password" placeholder="Mot de passe" autocomplete="current-password">
    <div class="err" id="l-err"></div>
    <button class="btn" id="l-btn" onclick="handleLogin()">Se connecter</button>
    <div class="toggle"><a onclick="show('signup')">Pas encore de compte ? Créer un accès →</a></div>
    <div class="toggle" style="margin-top:0.75rem"><a onclick="show('reset')">Mot de passe oublié ?</a></div>
  </div>

  <!-- SIGNUP -->
  <div id="view-signup" style="display:none">
    <input type="text" id="s-name" placeholder="Votre nom">
    <input type="text" id="s-villa" placeholder="Nom de votre villa">
    <input type="email" id="s-email" placeholder="Email" autocomplete="email">
    <input type="password" id="s-password" placeholder="Mot de passe (8 min)" autocomplete="new-password">
    <div class="err" id="s-err"></div>
    <div class="ok" id="s-ok"></div>
    <button class="btn" id="s-btn" onclick="handleSignup()">Créer mon compte</button>
    <div class="toggle"><a onclick="show('login')">← Retour connexion</a></div>
  </div>

  <!-- RESET -->
  <div id="view-reset" style="display:none">
    <input type="email" id="r-email" placeholder="Votre email" autocomplete="email">
    <div class="err" id="r-err"></div>
    <div class="ok" id="r-ok"></div>
    <button class="btn" id="r-btn" onclick="handleReset()">Envoyer le lien</button>
    <div class="toggle"><a onclick="show('login')">← Retour connexion</a></div>
  </div>

  <div id="loader">⏳ Chargement...</div>
</div>

<script>
const SUPA_URL = 'https://rcjhgilpmojohmrqzokx.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjamhnaWxwbW9qb2htcnF6b2t4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NDg4NzYsImV4cCI6MjA5MDIyNDg3Nn0.J7As0S5aw2ViIyKZXPNH6Kga5IUhn5XCz1khKcul8uQ';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// Si déjà connecté → direct app
sb.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'app.html';
});

function show(view) {
  ['login','signup','reset'].forEach(v => {
    document.getElementById('view-'+v).style.display = v === view ? 'block' : 'none';
  });
  const titles = {login:'Connectez-vous à votre dashboard villa', signup:'Créez votre accès Stafflo', reset:'Réinitialisez votre mot de passe'};
  document.getElementById('subtitle').textContent = titles[view];
}

function setLoad(on) {
  document.getElementById('loader').style.display = on ? 'block' : 'none';
  ['l-btn','s-btn','r-btn'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = on;
  });
}

function setMsg(id, msg, isErr=true) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  if (msg) setTimeout(() => el.textContent = '', 5000);
}

async function handleLogin() {
  const email = document.getElementById('l-email').value.trim();
  const password = document.getElementById('l-password').value;
  if (!email || !password) return setMsg('l-err', 'Email et mot de passe requis');
  setLoad(true);
  const { error } = await sb.auth.signInWithPassword({ email, password });
  setLoad(false);
  if (error) return setMsg('l-err', error.message === 'Invalid login credentials' ? 'Email ou mot de passe incorrect' : error.message);
  window.location.href = 'app.html';
}

async function handleSignup() {
  const full_name = document.getElementById('s-name').value.trim();
  const villa_name = document.getElementById('s-villa').value.trim();
  const email = document.getElementById('s-email').value.trim();
  const password = document.getElementById('s-password').value;
  if (!full_name || !villa_name || !email || !password) return setMsg('s-err', 'Tous les champs sont requis');
  if (password.length < 8) return setMsg('s-err', 'Mot de passe minimum 8 caractères');
  setLoad(true);
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name, villa_name } } });
  setLoad(false);
  if (error) return setMsg('s-err', error.message);
  if (data.user) {
    await sb.from('profiles').upsert({ id: data.user.id, email, full_name, villa_name });
  }
  setMsg('s-ok', '✅ Compte créé ! Vérifiez votre email pour confirmer.', false);
}

async function handleReset() {
  const email = document.getElementById('r-email').value.trim();
  if (!email) return setMsg('r-err', 'Email requis');
  setLoad(true);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/app.html' });
  setLoad(false);
  if (error) return setMsg('r-err', error.message);
  setMsg('r-ok', '✅ Lien envoyé ! Vérifiez votre email.', false);
}

// Touche Entrée
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const active = ['login','signup','reset'].find(v => document.getElementById('view-'+v).style.display !== 'none');
  if (active === 'login') handleLogin();
  else if (active === 'signup') handleSignup();
  else if (active === 'reset') handleReset();
});
</script>
</body>
</html>
